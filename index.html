<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inka Bistro Cusco | Menú Digital TikTok</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #c2410c;
      --accent: #f59e0b;
      --bg-warm: #18110e;
      --glass-panel: rgba(38, 28, 24, 0.88);
      --glass-border: rgba(245, 158, 11, 0.28);
      --text-main: #fffdfa;
      --text-muted: #d6cbbf;
      --gold-badge: #fbbf24;
      --whatsapp-green: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-warm); color: var(--text-main); }

    .app-container { width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; position: relative; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
    .app-container::-webkit-scrollbar { display: none; }

    /* CABECERA */
    .top-header {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 120;
      padding: 12px 14px 8px; background: linear-gradient(180deg, rgba(24, 17, 14, 0.96) 0%, rgba(24, 17, 14, 0.6) 75%, transparent 100%);
      display: flex; flex-direction: column; gap: 10px;
    }
    .top-bar-row { display: flex; align-items: center; justify-content: space-between; }
    .brand-section { display: flex; align-items: center; gap: 8px; }
    .brand-icon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--primary)); display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; }
    .brand-text h1 { font-size: 15px; font-weight: 900; line-height: 1.1; text-transform: uppercase; }
    .brand-text span { font-size: 10px; text-transform: uppercase; color: var(--accent); font-weight: 700; }

    .header-controls { display: flex; align-items: center; gap: 6px; }
    .select-pill { background: var(--glass-panel); border: 1px solid var(--glass-border); color: #fff; padding: 5px 8px; border-radius: 16px; font-size: 11px; font-weight: 700; outline: none; }
    .select-pill option { background: #221510; }
    .icon-pill-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--glass-panel); border: 1px solid var(--glass-border); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; }

    .category-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .category-chips::-webkit-scrollbar { display: none; }
    .chip { background: rgba(43, 31, 26, 0.7); border: 1px solid rgba(251, 191, 36, 0.25); color: var(--text-muted); padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip.active { background: linear-gradient(135deg, var(--primary), var(--accent)); border-color: var(--accent); color: #fff; font-weight: 700; }

    /* REEL SLIDES */
    .video-slide { width: 100%; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; position: relative; background: #1c1411; overflow: hidden; display: flex; align-items: flex-end; }
    .video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .slide-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(24,17,14,0.4) 0%, transparent 50%, rgba(24,17,14,0.92) 100%); pointer-events: none; }

    .side-actions { position: absolute; right: 12px; bottom: 105px; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #fff; cursor: pointer; }
    .action-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--glass-panel); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
    .action-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    .dish-info { position: relative; z-index: 10; padding: 0 75px 85px 16px; width: 100%; }
    .badge-tag { display: inline-block; background: var(--gold-badge); color: #381504; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; margin-bottom: 6px; }
    .dish-title { font-size: 21px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
    .dish-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dish-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .price-now { font-size: 23px; font-weight: 800; color: #fef08a; }
    .price-alt { font-size: 13px; color: #cbd5e1; font-weight: 600; }

    .btn-quick-add { background: linear-gradient(135deg, var(--primary), var(--accent)); border: 1px solid rgba(251, 191, 36, 0.4); color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

    /* BOTÓN FLOTANTE INFERIOR DERECHO */
    .chat-bubble-container { position: fixed; bottom: 20px; right: 18px; display: flex; align-items: center; gap: 8px; z-index: 1500; cursor: pointer; }
    .chat-bubble-label { background: linear-gradient(135deg, #fef08a 0%, #fde047 100%); color: #78350f; font-weight: 900; font-size: 13px; padding: 8px 14px; border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); border: 2px solid var(--accent); }
    .chat-bubble-btn { position: relative; width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; box-shadow: 0 6px 20px rgba(194, 65, 12, 0.5); display: flex; align-items: center; justify-content: center; border: 2px solid #facc15; }
    .chat-badge { position: absolute; top: -3px; right: -3px; background-color: #ef4444; color: #fff; border: 2px solid #fff; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* POPUP DE ORDEN */
    .popup-modal { position: fixed; inset: 0; background: rgba(18, 12, 10, 0.85); backdrop-filter: blur(6px); z-index: 2000; display: none; align-items: flex-end; justify-content: center; }
    .popup-modal.active { display: flex; }
    .popup-sheet { background: #241a15; width: 100%; max-width: 480px; max-height: 90dvh; border-radius: 24px 24px 0 0; padding: 18px 18px 24px; display: flex; flex-direction: column; border-top: 1.5px solid var(--glass-border); overflow-y: auto; }

    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
    .order-items-list { overflow-y: auto; max-height: 22dvh; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .order-item-row { display: flex; justify-content: space-between; align-items: center; background: #2d211b; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }

    .grid-payments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .btn-pay-option { background: #2d211b; border: 1px solid rgba(255, 255, 255, 0.12); color: var(--text-muted); padding: 8px 4px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-pay-option.active { background: linear-gradient(135deg, var(--primary), var(--accent)); border-color: var(--accent); color: #fff; }

    .cash-box-drawer { background: #2b1f1a; border: 1.5px dashed rgba(245, 158, 11, 0.4); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .cash-input { width: 100%; padding: 8px 12px; font-size: 15px; font-weight: 800; border: 1px solid var(--accent); border-radius: 8px; color: #fff; background: #1c1411; margin-top: 4px; }
    .cash-quick-btns { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .btn-quick-cash { background: #3a2a23; border: 1px solid rgba(245, 158, 11, 0.3); color: #fde047; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; cursor: pointer; }

    .vuelto-badge-box { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; background: rgba(21, 128, 61, 0.25); color: #86efac; border: 1px solid #15803d; }
    .vuelto-badge-box.alerta { background: rgba(220, 38, 38, 0.25); color: #fca5a5; border-color: #dc2626; }

    .custom-input { width: 100%; background: #2e221c; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: #fff; padding: 9px 12px; font-size: 13px; outline: none; margin-bottom: 8px; }
    .btn-submit-order { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; padding: 14px; border-radius: 24px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <div class="top-header">
    <div class="top-bar-row">
      <div class="brand-section">
        <div class="brand-icon" id="topIcon">🍽️</div>
        <div class="brand-text">
          <h1 id="topTitle">Inka Bistro</h1>
          <span id="topSlogan">Cusco • Gourmet</span>
        </div>
      </div>

      <div class="header-controls">
        <select class="select-pill" id="langSelector" onchange="changeLanguage(this.value)">
          <option value="es" selected>🇪🇸 ES</option>
          <option value="en">🇬🇧 EN</option>
          <option value="fr">🇫🇷 FR</option>
          <option value="pt">🇧🇷 PT</option>
        </select>
        <select class="select-pill" id="currencySelector" onchange="changeCurrency(this.value)">
          <option value="PEN" selected>S/ (PEN)</option>
          <option value="USD">$ (USD)</option>
        </select>
        <button class="icon-pill-btn" onclick="toggleGlobalAudio()"><i class="fa-solid fa-volume-xmark" id="audioIcon"></i></button>
      </div>
    </div>
    <div class="category-chips" id="categoryChips"></div>
  </div>

  <!-- FEED TIKTOK -->
  <div class="app-container" id="feedContainer"></div>

  <!-- BOTÓN FLOTANTE PEDIDOS -->
  <div class="chat-bubble-container" onclick="openOrdersPopup()">
    <div class="chat-bubble-label"><span>🔥 Pedidos</span></div>
    <div class="chat-bubble-btn">
      <i class="fa-solid fa-bell-concierge" style="color:#fff; font-size:22px;"></i>
      <div class="chat-badge" id="ordersBadgeCount">0</div>
    </div>
  </div>

  <!-- POPUP COMANDA -->
  <div class="popup-modal" id="ordersPopupModal" onclick="closeOrdersPopup(event)">
    <div class="popup-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <h3 style="color:#fef3c7;"><i class="fa-solid fa-receipt" style="color:#f59e0b;"></i> Confirmar Comanda</h3>
        <button style="background:none; border:none; color:#ccc; font-size:22px; cursor:pointer;" onclick="closeOrdersPopup()">&times;</button>
      </div>

      <div class="order-items-list" id="orderItemsList"></div>

      <!-- PAGO Y VUELTO -->
      <div class="grid-payments">
        <button type="button" class="btn-pay-option active" id="btnPayEfectivo" onclick="elegirPago('Efectivo', this)">💵 Efectivo</button>
        <button type="button" class="btn-pay-option" onclick="elegirPago('Yape', this)">🟣 Yape</button>
        <button type="button" class="btn-pay-option" onclick="elegirPago('Plin', this)">🔵 Plin</button>
        <button type="button" class="btn-pay-option" onclick="elegirPago('Tarjeta POS', this)">💳 POS</button>
      </div>

      <div class="cash-box-drawer" id="cajaEfectivoDesplegable">
        <div style="font-size: 11.5px; font-weight: 800; color: #fde047;">💵 ¿Con cuánto en efectivo pagarás?</div>
        <input type="number" id="montoEfectivoIngresado" class="cash-input" placeholder="Ej. 100" min="0" step="5" oninput="calcularVueltoEfectivo()"/>
        <div class="cash-quick-btns">
          <button type="button" class="btn-quick-cash" onclick="setMontoEfectivoRapido('exacto')">Pagar Exacto</button>
          <button type="button" class="btn-quick-cash" onclick="setMontoEfectivoRapido(50)">S/ 50</button>
          <button type="button" class="btn-quick-cash" onclick="setMontoEfectivoRapido(100)">S/ 100</button>
          <button type="button" class="btn-quick-cash" onclick="setMontoEfectivoRapido(200)">S/ 200</button>
        </div>
        <div class="vuelto-badge-box" id="cajaRespuestaVuelto">
          <span id="textoDetalleVuelto">Calculando vuelto...</span>
          <span id="montoCalculadoVuelto" style="font-size: 14px;"></span>
        </div>
      </div>

      <!-- MESA Y NOTAS -->
      <input type="text" id="tableOrAddressInput" class="custom-input" placeholder="Nº de Mesa (ej: Mesa 04 / Terraza / Barra)" />
      <input type="text" id="clientNameInput" class="custom-input" placeholder="Nombre de quien pide (opcional)" />
      <input type="text" id="notesInput" class="custom-input" placeholder="Especificaciones para cocina (término, alergias)" />

      <!-- TOTAL Y ENVÍO -->
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin: 10px 0; border-top:1px dashed rgba(255,255,255,0.15); padding-top:8px;">
        <span style="font-weight:800;">Total comanda:</span>
        <div>
          <span style="font-size:20px; font-weight:900; color:#fde047;" id="orderTotalPrice">S/ 0.00</span>
          <div style="font-size:11px; color:#aaa; text-align:right;" id="orderSecondaryPrice">≈ $ 0.00</div>
        </div>
      </div>

      <button class="btn-submit-order" id="btnEnviarComanda" onclick="enviarComandaDirectaAlPanel()">
        <i class="fa-solid fa-bell-concierge"></i> <span>Enviar Comanda al Panel / Cocina</span>
      </button>
      <div id="orderStatusMsg" style="text-align:center; font-size:12px; margin-top:6px; color:#86efac;"></div>
    </div>
  </div>

  <script>
    // CONFIGURACIÓN PREDETERMINADA
    let CONFIG = {
      nombre: "Inka Bistro Cusco",
      eslogan: "Cusco • Gourmet",
      logo: "🍽️",
      whatsapp: "51969773064",
      exchangeRateUSD: 3.75
    };

    let catalogo = [];
    const pedido = {};
    let currentLang = "es";
    let currentCurrency = "PEN";
    let currentCategory = "all";
    let isGlobalMuted = true;
    let metodoPago = "Efectivo";
    let videoObserver = null;
    let ultimoTotalPagarPEN = 0;

    // DETECTAR PARÁMETRO DE MESA DESDE EL CÓDIGO QR (?mesa=04)
    function detectarMesaDesdeURL() {
      const params = new URLSearchParams(window.location.search);
      const mesa = params.get('mesa');
      if (mesa) {
        document.getElementById('tableOrAddressInput').value = decodeURIComponent(mesa);
      }
    }

    async function cargarDatos() {
      try {
        const res = await fetch(`productos.json?_t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          catalogo = data.productos || data.catalogo || [];
          if (data.config) CONFIG = Object.assign(CONFIG, data.config);
          if (data.restaurante) CONFIG.nombre = data.restaurante;
        }
      } catch (e) { console.warn("Usando catálogo local", e); }

      if (catalogo.length === 0) {
        catalogo = [
          {
            id: "dish-1", category: "top", tag: "Plato Bandera", precioPEN: 46.00, disponible: true, likes: 542,
            videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            posterUrl: "https://images.unsplash.com/photo-1544025162-d76694265947?w=800",
            i18n: {
              es: { name: "Lomo Saltado al Wok Gourmet", desc: "Trozos jugosos de lomo fino salteados a fuego vivo con cebolla morada, tomate y papas nativas." },
              en: { name: "Wok-Seared Lomo Saltado", desc: "Tender beef tenderloin strips sautéed with red onions, tomatoes, and native fries." },
              fr: { name: "Lomo Saltado au Wok", desc: "Émincé de bœuf sauté au wok avec oignons rouges et frites andines." },
              pt: { name: "Lomo Saltado ao Wok", desc: "Tiras de filé mignon salteadas com cebola roxa e batatas nativas." }
            }
          }
        ];
      }

      document.getElementById('topTitle').innerText = CONFIG.nombre;
      document.getElementById('topSlogan').innerText = CONFIG.eslogan;
      document.getElementById('topIcon').innerText = CONFIG.logo || "🍽️";

      renderCategoryChips();
      renderFeed();
      setupObserver();
      detectarMesaDesdeURL();
    }

    function formatPrice(pen) {
      if (currentCurrency === "USD") return `$ ${(pen / CONFIG.exchangeRateUSD).toFixed(2)}`;
      return `S/ ${pen.toFixed(2)}`;
    }
    function formatSecondaryPrice(pen) {
      if (currentCurrency === "PEN") return `≈ $ ${(pen / CONFIG.exchangeRateUSD).toFixed(2)}`;
      return `≈ S/ ${pen.toFixed(2)}`;
    }

    function changeLanguage(l) { currentLang = l; renderCategoryChips(); renderFeed(); actualizarVistaPopup(); }
    function changeCurrency(c) { currentCurrency = c; renderFeed(); actualizarVistaPopup(); }

    function renderCategoryChips() {
      const cats = [
        { key: "all", label: "Todos" },
        { key: "top", label: "🔥 Especialidades" },
        { key: "mains", label: "Platos Fuertes" },
        { key: "drinks", label: "Bebidas & Cocteles" }
      ];
      document.getElementById('categoryChips').innerHTML = cats.map(c => `
        <div class="chip ${c.key === currentCategory ? 'active' : ''}" onclick="selectCat('${c.key}')">${c.label}</div>
      `).join('');
    }

    function selectCat(k) { currentCategory = k; renderCategoryChips(); renderFeed(); document.getElementById('feedContainer').scrollTo({ top: 0, behavior: 'smooth' }); }

    function renderFeed() {
      const feed = document.getElementById('feedContainer');
      feed.innerHTML = '';
      const filtrados = currentCategory === 'all' ? catalogo : catalogo.filter(d => d.category === currentCategory);

      filtrados.forEach(item => {
        const info = item.i18n?.[currentLang] || item.i18n?.['es'] || { name: item.nombre, desc: item.descripcion };
        const slide = document.createElement('div');
        slide.className = 'video-slide';
        slide.innerHTML = `
          <video class="video-player" src="${item.videoUrl}" poster="${item.posterUrl}" loop playsinline preload="metadata" ${isGlobalMuted ? 'muted' : ''} onclick="toggleVideo(this)"></video>
          <div class="slide-overlay"></div>
          <div class="side-actions">
            <button class="action-btn" onclick="this.classList.toggle('liked')"><div class="action-icon"><i class="fa-solid fa-heart"></i></div><span class="action-label">${item.likes || 100}</span></button>
            <button class="action-btn" onclick="addToOrder('${item.id}')"><div class="action-icon" style="background:#c2410c;"><i class="fa-solid fa-plus"></i></div><span class="action-label">+1</span></button>
          </div>
          <div class="dish-info">
            ${item.tag ? `<span class="badge-tag">${item.tag}</span>` : ''}
            <h2 class="dish-title">${info.name}</h2>
            <p class="dish-desc">${info.desc}</p>
            <div class="dish-price-row">
              <span class="price-now">${formatPrice(item.precioPEN || item.precio || 0)}</span>
              <span class="price-alt">${formatSecondaryPrice(item.precioPEN || item.precio || 0)}</span>
            </div>
            <button class="btn-quick-add" onclick="addToOrder('${item.id}')"><i class="fa-solid fa-plus"></i> Pedir Plato</button>
          </div>
        `;
        feed.appendChild(slide);
      });
      if (videoObserver) setupObserver();
    }

    function setupObserver() {
      if (videoObserver) videoObserver.disconnect();
      videoObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          const v = entry.target.querySelector('video');
          if (!v) return;
          if (entry.isIntersecting) { v.muted = isGlobalMuted; v.play().catch(()=>{}); }
          else { v.pause(); v.currentTime = 0; }
        });
      }, { root: document.getElementById('feedContainer'), threshold: 0.65 });
      document.querySelectorAll('.video-slide').forEach(s => videoObserver.observe(s));
    }

    function toggleVideo(v) { if (v.paused) v.play(); else v.pause(); }
    function toggleGlobalAudio() {
      isGlobalMuted = !isGlobalMuted;
      document.getElementById('audioIcon').className = isGlobalMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
      document.querySelectorAll('video').forEach(v => v.muted = isGlobalMuted);
    }

    /* CARRITO / ORDEN */
    function addToOrder(id) {
      pedido[id] = (pedido[id] || 0) + 1;
      actualizarVistaPopup();
    }
    function changeQty(id, delta) {
      if (!pedido[id]) return;
      pedido[id] += delta;
      if (pedido[id] <= 0) delete pedido[id];
      actualizarVistaPopup();
    }

    function actualizarVistaPopup() {
      const list = document.getElementById('orderItemsList');
      list.innerHTML = '';
      let totalU = 0, totalMonto = 0;

      Object.keys(pedido).forEach(id => {
        const d = catalogo.find(item => item.id === id);
        if (!d) return;
        const cant = pedido[id];
        const sub = cant * (d.precioPEN || d.precio || 0);
        totalU += cant;
        totalMonto += sub;
        const info = d.i18n?.[currentLang] || d.i18n?.['es'];

        list.innerHTML += `
          <div class="order-item-row">
            <div>
              <strong style="font-size:13px;">${info.name}</strong>
              <div style="font-size:11px; color:#aaa;">${formatPrice(d.precioPEN)} x ${cant} = <b>${formatPrice(sub)}</b></div>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <button style="width:24px; height:24px; border-radius:4px; background:#443027; color:#fff; border:none;" onclick="changeQty('${id}', -1)">-</button>
              <span style="font-weight:bold; font-size:13px; min-width:16px; text-align:center;">${cant}</span>
              <button style="width:24px; height:24px; border-radius:4px; background:#443027; color:#fff; border:none;" onclick="changeQty('${id}', 1)">+</button>
            </div>
          </div>
        `;
      });

      if (totalU === 0) list.innerHTML = '<p style="text-align:center; color:#888; font-size:13px; padding:16px;">Sin platos añadidos aún.</p>';

      ultimoTotalPagarPEN = totalMonto;
      document.getElementById('ordersBadgeCount').innerText = totalU;
      document.getElementById('orderTotalPrice').innerText = formatPrice(totalMonto);
      document.getElementById('orderSecondaryPrice').innerText = formatSecondaryPrice(totalMonto);
      if (metodoPago === 'Efectivo') calcularVueltoEfectivo();
    }

    function openOrdersPopup() { document.getElementById('ordersPopupModal').classList.add('active'); }
    function closeOrdersPopup() { document.getElementById('ordersPopupModal').classList.remove('active'); }

    function elegirPago(metodo, btn) {
      metodoPago = metodo;
      document.querySelectorAll('.btn-pay-option').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('cajaEfectivoDesplegable').style.display = metodo === 'Efectivo' ? 'block' : 'none';
      if (metodo === 'Efectivo') calcularVueltoEfectivo();
    }

    function setMontoEfectivoRapido(m) {
      const inp = document.getElementById('montoEfectivoIngresado');
      inp.value = m === 'exacto' ? (ultimoTotalPagarPEN > 0 ? ultimoTotalPagarPEN : '') : m;
      calcularVueltoEfectivo();
    }

    function calcularVueltoEfectivo() {
      const pagaCon = parseFloat(document.getElementById('montoEfectivoIngresado').value);
      const box = document.getElementById('cajaRespuestaVuelto');
      const txt = document.getElementById('textoDetalleVuelto');
      const montoTxt = document.getElementById('montoCalculadoVuelto');

      if (isNaN(pagaCon) || pagaCon <= 0) {
        box.className = "vuelto-badge-box";
        txt.innerText = "Ingresa monto en efectivo para vuelto";
        montoTxt.innerText = "";
        return;
      }
      const v = pagaCon - ultimoTotalPagarPEN;
      if (v < 0) {
        box.className = "vuelto-badge-box alerta";
        txt.innerText = `⚠️ Falta dinero (Faltan S/ ${Math.abs(v).toFixed(2)})`;
        montoTxt.innerText = "";
      } else {
        box.className = "vuelto-badge-box";
        txt.innerText = "💵 Vuelto a entregar:";
        montoTxt.innerText = `S/ ${v.toFixed(2)}`;
      }
    }

    // ==============================================================
    // ENVÍO DIRECTO DE LA COMANDA AL PANEL DE CONTROL
    // ==============================================================
    async function enviarComandaDirectaAlPanel() {
      const itemIds = Object.keys(pedido);
      if (itemIds.length === 0) return alert("Por favor añade al menos un plato a la comanda.");

      const mesa = document.getElementById('tableOrAddressInput').value.trim() || "Mesa en Sala (No especificada)";
      const cliente = document.getElementById('clientNameInput').value.trim() || "Comensal";
      const notas = document.getElementById('notesInput').value.trim();

      const btn = document.getElementById('btnEnviarComanda');
      const msg = document.getElementById('orderStatusMsg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Transmitiendo comanda a cocina...';

      let detalleTexto = "";
      const platosComanda = [];

      itemIds.forEach(id => {
        const dish = catalogo.find(d => d.id === id);
        const cant = pedido[id];
        const nom = (dish.i18n?.[currentLang] || dish.i18n?.['es']).name;
        detalleTexto += `${cant}x ${nom}, `;
        platosComanda.push({ id, nombre: nom, cantidad: cant, precio: dish.precioPEN });
      });

      const nuevaComanda = {
        id: "CMD-" + Date.now(),
        fecha: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        cliente: `${mesa} (${cliente})`,
        productos: detalleTexto.replace(/, $/, ""),
        items: platosComanda,
        totalPEN: ultimoTotalPagarPEN,
        pago: metodoPago,
        notas: notas,
        estado: "pendiente" // pendiente | cocina | servido
      };

      // 1. Guardar en almacenamiento compartido para el Panel de Control
      const STORAGE_KEY_COMANDAS = "inkabistro_comandas_activas";
      let comandasActivas = JSON.parse(localStorage.getItem(STORAGE_KEY_COMANDAS)) || [];
      comandasActivas.unshift(nuevaComanda);
      localStorage.setItem(STORAGE_KEY_COMANDAS, JSON.stringify(comandasActivas));

      // 2. Registro histórico para reportes contables
      const STORAGE_KEY_VENTAS = "inkabistro_ventas_registro";
      let ventas = JSON.parse(localStorage.getItem(STORAGE_KEY_VENTAS)) || [];
      ventas.unshift(nuevaComanda);
      localStorage.setItem(STORAGE_KEY_VENTAS, JSON.stringify(ventas));

      msg.innerText = "✔ ¡Comanda recibida en la pantalla de cocina del panel!";

      // 3. Opcional: Notificar a WhatsApp de respaldo
      setTimeout(() => {
        if (confirm("¿Deseas enviar también la confirmación al WhatsApp del restaurante?")) {
          const wspText = `🛎️ *NUEVA COMANDA [${nuevaComanda.id}]*\n📍 *Ubicación:* ${mesa}\n👤 *Cliente:* ${cliente}\n📋 *Platos:* ${detalleTexto}\n💰 *Total:* S/ ${ultimoTotalPagarPEN.toFixed(2)}\n💳 *Pago:* ${metodoPago}`;
          window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(wspText)}`, '_blank');
        }
        for (let k in pedido) delete pedido[k];
        actualizarVistaPopup();
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-bell-concierge"></i> Enviar Comanda al Panel / Cocina';
        closeOrdersPopup();
      }, 1000);
    }

    window.addEventListener('DOMContentLoaded', cargarDatos);
  </script>
