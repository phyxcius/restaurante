<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Menú QR Gourmet - Experiencia Turística</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary-color: #d97706; /* Ámbar / Dorado cálido */
      --primary-accent: #c2410c; /* Terracota / Fuego */
      --primary-gradient: linear-gradient(135deg, #ea580c, #b45309);
      --bg-warm: #1c1512;       /* Fondo madera tostada / café profundo */
      --glass-panel: rgba(38, 28, 24, 0.78);
      --glass-border: rgba(245, 158, 11, 0.28);
      --text-main: #fffdfa;
      --text-muted: #e2d9d2;
      --gold-badge: #fbbf24;
      --yape-purple: #742284;
      --plin-cyan: #00adb5;
      --whatsapp-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-warm);
      color: var(--text-main);
    }

    /* Contenedor Feed estilo Reels/TikTok */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      position: relative;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .app-container::-webkit-scrollbar {
      display: none;
    }

    /* Cabecera superior cálida traslúcida */
    .top-header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 120;
      padding: 12px 14px 8px;
      background: linear-gradient(180deg, rgba(28, 21, 18, 0.95) 0%, rgba(28, 21, 18, 0.6) 75%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
    }
    .brand-title i {
      color: var(--gold-badge);
    }
    .brand-title span {
      color: var(--gold-badge);
      font-weight: 900;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-pill {
      background: var(--glass-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    .select-pill option {
      background: #2b1f1a;
      color: #fff;
    }

    .icon-pill-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--glass-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .icon-pill-btn:active {
      transform: scale(0.92);
    }

    /* Chips de Categorías */
    .category-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .category-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(43, 31, 26, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(251, 191, 36, 0.25);
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--primary-gradient);
      border-color: #f59e0b;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(234, 88, 12, 0.45);
    }

    /* Video Reel Slide */
    .video-slide {
      width: 100%;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #231915;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .video-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: auto;
    }

    /* Gradiente cálido sobre el video */
    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, 
        rgba(35, 25, 21, 0.4) 0%, 
        rgba(35, 25, 21, 0.05) 45%, 
        rgba(28, 21, 18, 0.92) 100%);
      pointer-events: none;
    }

    /* Acciones laterales estilo TikTok */
    .side-actions {
      position: absolute;
      right: 12px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .action-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      color: #fff;
      transition: transform 0.15s ease;
    }
    .action-btn:active .action-icon {
      transform: scale(0.9);
    }
    .action-btn.liked .action-icon {
      color: #ef4444;
      border-color: #ef4444;
    }
    .action-icon.pay-icon {
      background: linear-gradient(135deg, var(--yape-purple), #9d2cb3);
      border: 1px solid #d946ef;
    }

    .action-label {
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      color: var(--text-muted);
    }

    /* Información del Plato */
    .dish-info {
      position: relative;
      z-index: 10;
      padding: 0 70px 96px 16px; /* Espacio inferior para no tapar con el botón pedidos */
      width: 100%;
    }

    .badge-tag {
      display: inline-block;
      background: var(--gold-badge);
      color: #451a03;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .dish-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.85);
      color: var(--text-main);
    }

    .dish-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .dish-price-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }

    .price-now {
      font-size: 23px;
      font-weight: 800;
      color: #fef08a;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .price-alt {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 600;
    }

    .btn-quick-add {
      background: var(--primary-gradient);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(180, 83, 9, 0.4);
      cursor: pointer;
    }
    .btn-quick-add:active {
      transform: scale(0.96);
    }

    /* ==============================================================
       BARRA INFERIOR FLOTANTE TIPO POPUP: "PEDIDOS"
       ============================================================== */
    .floating-orders-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 450px;
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(33, 24, 20, 0.92);
      backdrop-filter: blur(18px);
      border: 1.5px solid rgba(245, 158, 11, 0.4);
      border-radius: 36px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 15px rgba(217, 119, 6, 0.25);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .floating-orders-bar:active {
      transform: translateX(-50%) scale(0.98);
    }

    .orders-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .orders-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.4);
      position: relative;
    }

    .orders-count-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #dc2626;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .orders-text-wrap {
      display: flex;
      flex-direction: column;
    }

    .orders-title-text {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .orders-sub-text {
      font-size: 11px;
      color: #d6cbbf;
    }

    .orders-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .orders-total-highlight {
      font-size: 16px;
      font-weight: 900;
      color: #fde047;
    }

    .orders-open-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
    }

    /* ==============================================================
       MODALES / POPUPS (CARRITO Y YAPE/PLIN)
       ============================================================== */
    .popup-modal {
      position: fixed;
      inset: 0;
      background: rgba(18, 12, 10, 0.82);
      backdrop-filter: blur(6px);
      z-index: 250;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .popup-modal.active {
      display: flex;
    }

    .popup-sheet {
      background: #241a15;
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      border-radius: 26px 26px 0 0;
      padding: 22px 20px 24px;
      display: flex;
      flex-direction: column;
      animation: slideUpSheet 0.25s ease-out;
      border-top: 1.5px solid var(--glass-border);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    }
    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .sheet-header h3 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fef3c7;
    }

    .sheet-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
    }

    /* Lista de Platos en Pedidos */
    .order-items-list {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      max-height: 36dvh;
      padding-right: 2px;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2d211b;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .item-row-info {
      flex: 1;
      padding-right: 10px;
    }
    .item-row-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .item-row-sub {
      font-size: 12px;
      color: #d1c7be;
      margin-top: 2px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3e2e26;
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .order-form-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .custom-input {
      background: #2e221c;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      outline: none;
    }
    .custom-input:focus {
      border-color: #f59e0b;
    }

    .payment-method-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pay-chip {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      background: #2d211b;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      color: #ccc;
    }
    .pay-chip.selected {
      background: var(--primary-gradient);
      color: #fff;
      border-color: #f59e0b;
    }

    .order-totals-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
      border-top: 1px dashed rgba(255,255,255,0.15);
      padding-top: 10px;
    }
    .order-totals-bar .totals-val {
      font-size: 21px;
      color: #fde047;
    }

    .btn-send-whatsapp {
      background: var(--whatsapp-green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 26px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
      transition: transform 0.15s;
    }
    .btn-send-whatsapp:active {
      transform: scale(0.98);
    }

    /* Modal Yape / Plin */
    .qr-modal-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 10px 0;
    }
    .qr-box-image {
      width: 190px;
      height: 190px;
      background: #fff;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .qr-box-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .copy-phone-pill {
      background: #2f231d;
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Cabecera Superior: Logo, Idioma, Moneda y Audio -->
  <div class="top-header">
    <div class="top-bar-row">
      <div class="brand-title">
        <i class="fa-solid fa-utensils"></i> <span id="brandName">INKA</span> BISTRO
      </div>

      <div class="header-controls">
        <!-- Idiomas -->
        <select class="select-pill" id="langSelector" onchange="changeLanguage(this.value)">
          <option value="es">🇪🇸 ES</option>
          <option value="en" selected>🇬🇧 EN</option>
          <option value="fr">🇫🇷 FR</option>
          <option value="pt">🇧🇷 PT</option>
        </select>

        <!-- Moneda -->
        <select class="select-pill" id="currencySelector" onchange="changeCurrency(this.value)">
          <option value="PEN" selected>S/ (PEN)</option>
          <option value="USD">$ (USD)</option>
        </select>

        <!-- Audio Global -->
        <button class="icon-pill-btn" onclick="toggleGlobalAudio()" title="Sonido">
          <i class="fa-solid fa-volume-xmark" id="audioIcon"></i>
        </button>
      </div>
    </div>

    <!-- Filtro de Categorías -->
    <div class="category-chips" id="categoryChips"></div>
  </div>

  <!-- Contenedor Feed Reels con Video y Fallback -->
  <div class="app-container" id="feedContainer"></div>

  <!-- ==============================================================
       BARRA INFERIOR FLOTANTE TIPO POPUP: "PEDIDOS"
       ============================================================== -->
  <div class="floating-orders-bar" onclick="openOrdersPopup()">
    <div class="orders-bar-left">
      <div class="orders-icon-wrap">
        <i class="fa-solid fa-bell-concierge"></i>
        <span class="orders-count-badge" id="ordersBadgeCount">0</span>
      </div>
      <div class="orders-text-wrap">
        <span class="orders-title-text" id="ui_ordersBtnText">
          Pedidos <i class="fa-solid fa-chevron-up" style="font-size:10px; color:#f59e0b;"></i>
        </span>
        <span class="orders-sub-text" id="ui_ordersSubText">Toca para revisar comanda</span>
      </div>
    </div>
    <div class="orders-bar-right">
      <span class="orders-total-highlight" id="ordersBarTotal">S/ 0.00</span>
      <div class="orders-open-arrow">
        <i class="fa-solid fa-arrow-right"></i>
      </div>
    </div>
  </div>

  <!-- ==============================================================
       POPUP / DRAWER DE PEDIDOS (CARRITO)
       ============================================================== -->
  <div class="popup-modal" id="ordersPopupModal" onclick="closeOrdersPopup(event)">
    <div class="popup-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <h3 id="ui_cartTitle"><i class="fa-solid fa-clipboard-list" style="color:#f59e0b;"></i> Tu Comanda</h3>
        <button class="sheet-close-btn" onclick="closeOrdersPopup()">&times;</button>
      </div>

      <div class="order-items-list" id="orderItemsList">
        <div style="text-align:center; color:#9c8e85; padding:24px 0;" id="ui_emptyCart">No hay platos añadidos aún.</div>
      </div>

      <div class="order-form-inputs">
        <input type="text" id="tableInput" class="custom-input" placeholder="Mesa / Table Nº (ej: Mesa 04 o Terraza)" />
        <input type="text" id="notesInput" class="custom-input" placeholder="Alergias o especificaciones (ej: sin cebolla)" />
      </div>

      <!-- Selector de medio de pago -->
      <div class="payment-method-selector">
        <div class="pay-chip selected" onclick="selectPayMethod('yape_plin', this)">Yape / Plin</div>
        <div class="pay-chip" onclick="selectPayMethod('tarjeta', this)">Tarjeta POS</div>
        <div class="pay-chip" onclick="selectPayMethod('efectivo', this)">Efectivo</div>
      </div>

      <div class="order-totals-bar">
        <span id="ui_totalLabel">Total:</span>
        <div>
          <span class="totals-val" id="orderTotalPrice">S/ 0.00</span>
          <div style="font-size:11px; color:#aaa; text-align:right;" id="orderSecondaryPrice">≈ $ 0.00</div>
        </div>
      </div>

      <button class="btn-send-whatsapp" onclick="sendOrderWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> <span id="ui_sendWspBtn">Confirmar Pedido a Cocina</span>
      </button>
    </div>
  </div>

  <!-- ==============================================================
       MODAL DE PAGO DIRECTO YAPE / PLIN
       ============================================================== -->
  <div class="popup-modal" id="yapeModal" onclick="closeYapeModal(event)">
    <div class="popup-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <h3><i class="fa-solid fa-qrcode" style="color:#742284;"></i> Pagar con Yape o Plin</h3>
        <button class="sheet-close-btn" onclick="closeYapeModal()">&times;</button>
      </div>

      <div class="qr-modal-body">
        <div class="qr-box-image">
          <!-- QR dinámico para escanear en Yape o Plin -->
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=00020101021153036045802PE5915INKA%20BISTRO%20CUSCO6005CUSCO62070503***6304" alt="QR Yape Plin" />
        </div>
        
        <p style="font-size: 13px; color: #d6cbbf;">Escanea desde tu app de <b>Yape</b> o <b>Plin</b>, o transfiere al número:</p>

        <div class="copy-phone-pill" onclick="copyYapeNumber()">
          <span id="yapePhoneNumber">+51 987 654 321</span>
          <i class="fa-regular fa-copy" style="color:#f59e0b;"></i>
        </div>
        <span style="font-size: 11px; color: #a89f97;">Titular: INKA BISTRO E.I.R.L.</span>
      </div>
    </div>
  </div>

  <script>
    // Configuración del Restaurante
    const CONFIG = {

    // Platos de la carta

    // Estados
    let currentLang = "en";
    let currentCurrency = "PEN";
    let currentCategory = "all";
    let isGlobalMuted = true;
    let selectedPayMethod = "yape_plin";
    let cart = {}; // { dish_id: quantity }
    let videoObserver = null;

    function init() {
      renderCategoryChips();
      renderFeed();
      updateStaticTexts();
      setupObserver();
      updateOrdersBar();
    }

    function changeLanguage(lang) {
      currentLang = lang;
      renderCategoryChips();
      renderFeed();
      updateStaticTexts();
      updateOrdersPopupUI();
      updateOrdersBar();
    }

    function changeCurrency(curr) {
      currentCurrency = curr;
      renderFeed();
      updateOrdersBar();
      updateOrdersPopupUI();
    }

    function formatPrice(amountPEN) {
      if (currentCurrency === "USD") {
        const valUSD = amountPEN / CONFIG.exchangeRateUSD;
        return `$ ${valUSD.toFixed(2)}`;
      }
      return `S/ ${amountPEN.toFixed(2)}`;
    }

    function formatSecondaryPrice(amountPEN) {
      if (currentCurrency === "PEN") {
        const valUSD = amountPEN / CONFIG.exchangeRateUSD;
        return `≈ $ ${valUSD.toFixed(2)}`;
      }
      return `≈ S/ ${amountPEN.toFixed(2)}`;
    }

    function updateStaticTexts() {
      const t = translations[currentLang];
      document.getElementById("ui_ordersBtnText").innerHTML = `${t.ordersLabel} <i class="fa-solid fa-chevron-up" style="font-size:10px; color:#f59e0b;"></i>`;
      document.getElementById("ui_ordersSubText").innerText = t.ordersSub;
      document.getElementById("ui_cartTitle").innerHTML = `<i class="fa-solid fa-clipboard-list" style="color:#f59e0b;"></i> ${t.cartTitle}`;
      document.getElementById("ui_emptyCart").innerText = t.emptyCart;
      document.getElementById("tableInput").placeholder = t.tablePlaceholder;
      document.getElementById("notesInput").placeholder = t.notesPlaceholder;
      document.getElementById("ui_totalLabel").innerText = t.totalLabel;
      document.getElementById("ui_sendWspBtn").innerText = t.sendWspBtn;
    }

    function renderCategoryChips() {
      const t = translations[currentLang];
      const categories = [
        { key: "all", label: t.all },
        { key: "top", label: `🔥 ${t.top}` },
        { key: "mains", label: t.mains },
        { key: "drinks", label: t.drinks }
      ];

      const container = document.getElementById("categoryChips");
      container.innerHTML = categories.map(c => `
        <div class="chip ${c.key === currentCategory ? 'active' : ''}" onclick="selectCategory('${c.key}')">
          ${c.label}
        </div>
      `).join("");
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategoryChips();
      renderFeed();
      document.getElementById("feedContainer").scrollTo({ top: 0, behavior: "smooth" });
    }

    // Render del Feed
    function renderFeed() {
      const feed = document.getElementById("feedContainer");
      feed.innerHTML = "";
      const t = translations[currentLang];

      const filtered = currentCategory === "all" 
        ? menuData 
        : menuData.filter(d => d.category === currentCategory);

      filtered.forEach((item) => {
        const dishInfo = item.i18n[currentLang] || item.i18n["en"];
        const slide = document.createElement("div");
        slide.className = "video-slide";

        slide.innerHTML = `
          <video class="video-player" 
                 src="${item.videoUrl}" 
                 poster="${item.posterUrl}" 
                 loop playsinline preload="metadata" 
                 ${isGlobalMuted ? 'muted' : ''} 
                 onclick="toggleVideoPlayback(this)"
                 onerror="handleVideoError(this)">
          </video>
          <div class="slide-overlay"></div>

          <!-- Acciones laterales -->
          <div class="side-actions">
            <button class="action-btn" onclick="toggleLike(this, ${item.likes})">
              <div class="action-icon"><i class="fa-solid fa-heart"></i></div>
              <span class="action-label">${item.likes}</span>
            </button>

            <button class="action-btn" onclick="openYapeModal()">
              <div class="action-icon pay-icon"><i class="fa-solid fa-qrcode"></i></div>
              <span class="action-label">Yape/Plin</span>
            </button>

            <button class="action-btn" onclick="shareDish('${dishInfo.name.replace(/'/g, "\\'")}')">
              <div class="action-icon"><i class="fa-solid fa-share"></i></div>
              <span class="action-label">Share</span>
            </button>
          </div>

          <!-- Información del plato -->
          <div class="dish-info">
            ${item.tag ? `<span class="badge-tag">${item.tag}</span>` : ""}
            <h2 class="dish-title">${dishInfo.name}</h2>
            <p class="dish-desc">${dishInfo.desc}</p>
            
            <div class="dish-price-row">
              <span class="price-now">${formatPrice(item.pricePEN)}</span>
              <span class="price-alt">${formatSecondaryPrice(item.pricePEN)}</span>
            </div>

            <button class="btn-quick-add" onclick="addToCart('${item.id}')">
              <i class="fa-solid fa-plus"></i> ${t.addBtn}
            </button>
          </div>
        `;
        feed.appendChild(slide);
      });

      if (videoObserver) setupObserver();
    }

    // Observer para reproducción automática sin errores
    function setupObserver() {
      if (videoObserver) videoObserver.disconnect();

      const options = { root: document.getElementById("feedContainer"), threshold: 0.65 };
      videoObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const video = entry.target.querySelector("video");
          if (!video) return;

          if (entry.isIntersecting) {
            video.muted = isGlobalMuted;
            try {
              const playPromise = video.play();
              if (playPromise !== undefined) {
                playPromise.catch(() => {});
              }
            } catch (e) {}
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, options);

      document.querySelectorAll(".video-slide").forEach(slide => videoObserver.observe(slide));
    }

    function toggleVideoPlayback(video) {
      if (video.paused) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }

    function handleVideoError(video) {
      video.style.display = "none";
    }

    function toggleGlobalAudio() {
      isGlobalMuted = !isGlobalMuted;
      const audioIcon = document.getElementById("audioIcon");
      audioIcon.className = isGlobalMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";

      document.querySelectorAll("video").forEach(v => {
        v.muted = isGlobalMuted;
      });
    }

    function toggleLike(btn, base) {
      btn.classList.toggle("liked");
      const label = btn.querySelector(".action-label");
      const isLiked = btn.classList.contains("liked");
      label.innerText = isLiked ? base + 1 : base;
    }

    // ==============================================================
    // GESTIÓN DE PEDIDOS Y BARRA FLOTANTE
    // ==============================================================
    function addToCart(dishId) {
      cart[dishId] = (cart[dishId] || 0) + 1;
      updateOrdersBar();
      updateOrdersPopupUI();
    }

    function changeQty(dishId, delta) {
      if (!cart[dishId]) return;
      cart[dishId] += delta;
      if (cart[dishId] <= 0) {
        delete cart[dishId];
      }
      updateOrdersBar();
      updateOrdersPopupUI();
    }

    function calculateTotalPEN() {
      let totalPEN = 0;
      Object.keys(cart).forEach(id => {
        const dish = menuData.find(d => d.id === id);
        if (dish) {
          totalPEN += dish.pricePEN * cart[id];
        }
      });
      return totalPEN;
    }

    function updateOrdersBar() {
      const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      const totalPEN = calculateTotalPEN();

      document.getElementById("ordersBadgeCount").innerText = totalCount;
      document.getElementById("ordersBarTotal").innerText = formatPrice(totalPEN);
    }

    function updateOrdersPopupUI() {
      const list = document.getElementById("orderItemsList");
      const dishIds = Object.keys(cart);
      const t = translations[currentLang];
      const totalPEN = calculateTotalPEN();

      if (dishIds.length === 0) {
        list.innerHTML = `<div style="text-align:center; color:#9c8e85; padding:24px 0;">${t.emptyCart}</div>`;
        document.getElementById("orderTotalPrice").innerText = formatPrice(0);
        document.getElementById("orderSecondaryPrice").innerText = formatSecondaryPrice(0);
        return;
      }

      let html = "";
      dishIds.forEach(id => {
        const dish = menuData.find(d => d.id === id);
        if (!dish) return;
        const qty = cart[id];
        const subtotalPEN = dish.pricePEN * qty;
        const dishName = (dish.i18n[currentLang] || dish.i18n["en"]).name;

        html += `
          <div class="order-item-row">
            <div class="item-row-info">
              <div class="item-row-title">${dishName}</div>
              <div class="item-row-sub">${formatPrice(dish.pricePEN)} x ${qty} = <b>${formatPrice(subtotalPEN)}</b></div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty('${id}', -1)">-</button>
              <span style="font-weight:800; font-size:14px; color:#fff;">${qty}</span>
              <button class="qty-btn" onclick="changeQty('${id}', 1)">+</button>
            </div>
          </div>
        `;
      });

      list.innerHTML = html;
      document.getElementById("orderTotalPrice").innerText = formatPrice(totalPEN);
      document.getElementById("orderSecondaryPrice").innerText = formatSecondaryPrice(totalPEN);
    }

    function openOrdersPopup() {
      document.getElementById("ordersPopupModal").classList.add("active");
    }

    function closeOrdersPopup(e) {
      document.getElementById("ordersPopupModal").classList.remove("active");
    }

    function selectPayMethod(method, element) {
      selectedPayMethod = method;
      document.querySelectorAll(".pay-chip").forEach(c => c.classList.remove("selected"));
      element.classList.add("selected");
    }

    // Envío de la comanda por WhatsApp
    function sendOrderWhatsApp() {
      const dishIds = Object.keys(cart);
      const t = translations[currentLang];
      if (dishIds.length === 0) {
        alert(t.emptyCart);
        return;
      }

      const tableNo = document.getElementById("tableInput").value.trim() || "No especificada";
      const notes = document.getElementById("notesInput").value.trim();
      const totalPEN = calculateTotalPEN();

      let orderText = `🛎️ *${t.wspGreeting}: ${tableNo}*\n\n`;

      dishIds.forEach(id => {
        const dish = menuData.find(d => d.id === id);
        const qty = cart[id];
        const subtotalPEN = dish.pricePEN * qty;
        const name = (dish.i18n[currentLang] || dish.i18n["en"]).name;
        orderText += `▪️ *${qty}x* ${name} — ${formatPrice(subtotalPEN)}\n`;
      });

      orderText += `\n💰 *${t.wspTotal}:* ${formatPrice(totalPEN)} (${formatSecondaryPrice(totalPEN)})`;
      orderText += `\n💳 *${t.wspPayMethod}:* ${selectedPayMethod.toUpperCase()}`;

      if (notes) {
        orderText += `\n📝 *Notas:* ${notes}`;
      }

      orderText += `\n\n_(Pedido generado desde la carta QR interactiva)_`;

      const wspUrl = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(orderText)}`;
      window.open(wspUrl, "_blank");
    }

    // Modal Yape / Plin
    function openYapeModal() {
      document.getElementById("yapeModal").classList.add("active");
    }

    function closeYapeModal() {
      document.getElementById("yapeModal").classList.remove("active");
    }

    function copyYapeNumber() {
      navigator.clipboard.writeText(CONFIG.yapePhone).then(() => {
        alert(translations[currentLang].copied);
      });
    }

    function shareDish(name) {
      if (navigator.share) {
        navigator.share({ title: name, text: `Mira este plato en el menú: ${name}`, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Enlace copiado al portapapeles");
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
