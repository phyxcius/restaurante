<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Cusqueñita | Menú Digital & Mozo</title>
  <meta name="description" content="Carta y Menú Digital interactivo en formato de video reels gastronómicos y toma de comandas para mozos y comensales." />
  <meta property="og:title" content="La Cusqueñita | Menú Digital & Mozo" />
  <meta property="og:description" content="Carta y Menú Digital interactivo en formato de video reels gastronómicos y toma de comandas para mozos y comensales." />
  <link rel="icon" href="./CHUSPITA-circulo.png" />
  <script>
    if (window.location.pathname.length > 1 && !window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
      window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
    }
    window.addEventListener('error', function(e) {
      console.error('System loader error:', e);
      var root = document.getElementById('root');
      if (root && (!root.children.length || root.querySelector('.initial-loader'))) {
        root.innerHTML = '<div style="min-height:100vh;background:#050d1a;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;"><div style="max-width:420px;background:#09152b;border:1px solid rgba(245,158,11,0.5);border-radius:20px;padding:28px;box-shadow:0 20px 40px rgba(0,0,0,0.8);"><span style="font-size:42px;display:block;margin-bottom:12px;">🍽️</span><h2 style="color:#f59e0b;font-size:20px;font-weight:900;margin-bottom:8px;">La Cusqueñita</h2><p style="color:#94a3b8;font-size:13px;line-height:1.5;margin-bottom:20px;">Cargando estación o datos del restaurante...</p><button onclick="localStorage.clear();location.reload();" style="background:#f59e0b;color:#050d1a;font-weight:900;border:none;padding:12px 24px;border-radius:12px;cursor:pointer;font-size:13px;">Restablecer Datos y Recargar</button></div></div>';
      }
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050d1a] text-slate-100 antialiased overflow-x-hidden selection:bg-amber-500 selection:text-slate-900">
  <div id="root">
    <div class="initial-loader" style="min-height:100vh;background-color:#050d1a;color:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:20px;">
      <div style="width:52px;height:52px;border-radius:50%;border:3px solid rgba(245,158,11,0.25);border-top-color:#f59e0b;animation:rotarLoader 1s linear infinite;margin-bottom:18px;"></div>
      <h1 style="font-size:22px;font-weight:900;color:#f59e0b;margin-bottom:6px;letter-spacing:0.5px;">🍽️ La Cusqueñita</h1>
      <p style="font-size:13px;color:#94a3b8;">Cargando Menú Digital & Terminal de Comandas...</p>
      <style>@keyframes rotarLoader { to { transform: rotate(360deg); } }</style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
