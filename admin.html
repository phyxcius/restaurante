<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración | Inka Bistro Cusco</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #c2410c;         /* Terracota */
      --primary-dark: #9a3412;
      --accent: #f59e0b;          /* Ámbar / Dorado */
      --accent-hover: #d97706;
      --bg-dark: #140e0c;         /* Fondo café profundo */
      --card-bg: #221814;
      --card-border: rgba(245, 158, 11, 0.22);
      --input-bg: #1a120f;
      --text-main: #fffdfa;
      --text-muted: #d1c7be;
      --gold: #fbbf24;
      --danger: #ef4444;
      --success: #15803d;
      --yape: #742284;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    header {
      background: #1c1310;
      border-bottom: 1.5px solid var(--card-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand-title span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: #2e201b;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: #3a2a24;
      color: #fff;
    }

    .btn-success {
      background: #16a34a;
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    /* CONTENEDOR PRINCIPAL */
    .admin-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      flex: 1;
    }

    /* PANEL LATERAL DE AJUSTES GLOBALES */
    .sidebar-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .admin-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-input, .form-select, .form-textarea {
      background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
      transition: border 0.2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
    }

    /* GENERADOR DE CÓDIGO QR PARA MESAS */
    .qr-preview-box {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
    }
    .qr-preview-box img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }
    .qr-table-text {
      color: #1a120f;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* CONTENIDO PRINCIPAL: GESTIÓN DE PLATOS */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-number {
      font-size: 24px;
      font-weight: 900;
      color: var(--gold);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* GRILLA DE PLATOS */
    .dishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .dish-admin-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .dish-admin-card:hover {
      transform: translateY(-3px);
    }

    .dish-media-header {
      position: relative;
      height: 140px;
      background: #110c0a;
      overflow: hidden;
    }
    .dish-media-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dish-category-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(194, 65, 12, 0.9);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .dish-tag-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--gold);
      color: #381504;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .dish-admin-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dish-admin-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .dish-admin-desc {
      font-size: 12px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

    .dish-admin-prices {
      margin-top: 6px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .price-pen {
      font-size: 18px;
      font-weight: 900;
      color: #fde047;
    }
    .price-usd {
      font-size: 12px;
      color: #cbd5e1;
    }

    .dish-admin-reviews-badge {
      font-size: 11px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      cursor: pointer;
    }

    .dish-admin-footer {
      padding: 10px 14px;
      background: #1c1310;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* MODAL DE EDICIÓN / CREACIÓN */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #241a15;
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .lang-tabs {
      display: flex;
      gap: 6px;
      background: #18110e;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .lang-tab-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      background: transparent;
      border: none;
      color: #aaa;
      border-radius: 6px;
      cursor: pointer;
    }
    .lang-tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* MODAL DE RESEÑAS */
    .reviews-admin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
    }
    .review-admin-item {
      background: #1c1310;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .admin-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER SUPERIOR -->
  <header>
    <div class="brand-wrap">
      <div class="brand-icon"><i class="fa-solid fa-utensils"></i></div>
      <div class="brand-title">
        <h1>Inka Bistro Cusco</h1>
        <span>Panel de Gestión y Menú Digital</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" onclick="exportarJSON()"><i class="fa-solid fa-download"></i> Descargar JSON</button>
      <button class="btn btn-primary" onclick="abrirModalPlato()"><i class="fa-solid fa-plus"></i> Nuevo Plato</button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="admin-container">

    <!-- SIDEBAR: CONFIGURACIÓN Y CÓDIGOS QR -->
    <aside class="sidebar-panel">

      <!-- CONFIGURACIÓN DE CONTACTO Y PAGOS -->
      <div class="admin-card">
        <h2 class="card-title"><i class="fa-solid fa-sliders"></i> Ajustes de Cobro</h2>

        <div class="form-group">
          <label class="form-label">WhatsApp de Pedidos</label>
          <input type="text" id="cfgWhatsApp" class="form-input" value="51969773064" onchange="guardarConfiguracion()"/>
        </div>

        <div class="form-group">
          <label class="form-label">Celular Yape / Plin</label>
          <input type="text" id="cfgYapePhone" class="form-input" value="+51 987 654 321" onchange="guardarConfiguracion()"/>
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Cambio (1 USD en PEN)</label>
          <input type="number" id="cfgExchangeRate" class="form-input" step="0.01" value="3.75" onchange="guardarConfiguracion()"/>
        </div>

        <button class="btn btn-success" style="width: 100%; justify-content: center;" onclick="guardarConfiguracion()">
          <i class="fa-solid fa-check"></i> Guardar Ajustes
        </button>
      </div>

      <!-- GENERADOR DE QR PARA MESAS -->
      <div class="admin-card">
        <h2 class="card-title"><i class="fa-solid fa-qrcode"></i> Generador QR de Mesa</h2>
        
        <div class="form-group">
          <label class="form-label">Número de Mesa o Espacio</label>
          <input type="text" id="qrTableInput" class="form-input" value="Mesa 01" oninput="actualizarQRImprimible()"/>
        </div>

        <div class="form-group">
          <label class="form-label">URL Base del Menú</label>
          <input type="text" id="qrBaseUrlInput" class="form-input" value="https://tudominio.com/menu/" oninput="actualizarQRImprimible()"/>
        </div>

        <div class="qr-preview-box" id="qrPrintArea">
          <img id="qrGeneratedImg" src="" alt="QR Mesa" />
          <span class="qr-table-text" id="qrTableLabel">Mesa 01</span>
        </div>

        <button class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="imprimirQRMesa()">
          <i class="fa-solid fa-print"></i> Imprimir QR para Mesa
        </button>
      </div>

    </aside>

    <!-- ÁREA PRINCIPAL: LISTA DE PLATOS -->
    <main class="main-content">

      <!-- TARJETAS DE RESUMEN -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-number" id="statTotalDishes">0</span>
          <span class="stat-label">Platos en Menú</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="statSpecialties">0</span>
          <span class="stat-label">Especialidades del Chef</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="statDrinks">0</span>
          <span class="stat-label">Bebidas y Cocteles</span>
        </div>
      </div>

      <!-- GRILLA DE PLATOS -->
      <div class="dishes-grid" id="dishesGrid"></div>

    </main>
  </div>

  <!-- MODAL: AGREGAR / EDITAR PLATO MULTILINGÜE -->
  <div class="modal-overlay" id="dishModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalDishTitle" style="color:var(--gold);"><i class="fa-solid fa-bowl-food"></i> Editar Plato</h3>
        <button style="background:none; border:none; color:#ccc; font-size:22px; cursor:pointer;" onclick="cerrarModalPlato()">&times;</button>
      </div>

      <!-- Pestañas de Idioma -->
      <div class="lang-tabs">
        <button class="lang-tab-btn active" onclick="switchLangTab('es')">🇪🇸 Español</button>
        <button class="lang-tab-btn" onclick="switchLangTab('en')">🇬🇧 English</button>
        <button class="lang-tab-btn" onclick="switchLangTab('fr')">🇫🇷 Français</button>
        <button class="lang-tab-btn" onclick="switchLangTab('pt')">🇧🇷 Português</button>
      </div>

      <!-- Contenidos traducibles -->
      <div id="langFields">
        <div class="form-group">
          <label class="form-label" id="lblDishName">Nombre del Plato (ES)</label>
          <input type="text" id="inputDishName" class="form-input" placeholder="Ej: Lomo Saltado Criollo Gourmet"/>
        </div>

        <div class="form-group">
          <label class="form-label" id="lblDishDesc">Descripción (ES)</label>
          <textarea id="inputDishDesc" class="form-textarea" rows="2" placeholder="Detalles de los ingredientes y preparación..."></textarea>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">Precio en Soles (PEN S/)</label>
          <input type="number" id="inputDishPrice" class="form-input" step="0.5" placeholder="45.00"/>
        </div>

        <div class="form-group">
          <label class="form-label">Categoría</label>
          <select id="inputDishCategory" class="form-select">
            <option value="top">🔥 Especialidades (Top)</option>
            <option value="mains">Platos Fuertes</option>
            <option value="drinks">Bebidas y Cocteles</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">Etiqueta Destacada (Badge)</label>
          <input type="text" id="inputDishTag" class="form-input" placeholder="Ej: Plato Bandera / Must Try"/>
        </div>

        <div class="form-group">
          <label class="form-label">Likes Iniciales</label>
          <input type="number" id="inputDishLikes" class="form-input" value="150"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">URL del Video Vertical (MP4)</label>
        <input type="text" id="inputDishVideo" class="form-input" placeholder="https://tudominio.com/videos/lomo.mp4"/>
      </div>

      <div class="form-group">
        <label class="form-label">URL Imagen Poster (Fallback)</label>
        <input type="text" id="inputDishPoster" class="form-input" placeholder="https://tudominio.com/fotos/lomo.jpg"/>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
        <button class="btn btn-secondary" onclick="cerrarModalPlato()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarPlato()"><i class="fa-solid fa-floppy-disk"></i> Guardar Plato</button>
      </div>
    </div>
  </div>

  <!-- MODAL: GESTIÓN DE RESEÑAS -->
  <div class="modal-overlay" id="reviewsAdminModal">
    <div class="modal-box" style="max-width:550px;">
      <div class="modal-header">
        <h3 style="color:#38bdf8;"><i class="fa-solid fa-comments"></i> <span id="reviewsModalTitle">Reseñas del Plato</span></h3>
        <button style="background:none; border:none; color:#ccc; font-size:22px; cursor:pointer;" onclick="cerrarModalReseñas()">&times;</button>
      </div>

      <div class="reviews-admin-list" id="reviewsListAdmin"></div>

      <div style="display:flex; justify-content:flex-end; margin-top:10px;">
        <button class="btn btn-secondary" onclick="cerrarModalReseñas()">Cerrar</button>
      </div>
    </div>
  </div>

          en: { name: "Cathedral Pisco Sour", desc: "Crafted with premium Quebranta Pisco, freshly pressed lime, house-made syrup, egg white foam, and Angostura bitters." },
          fr: { name: "Pisco Sour Cathédrale", desc: "Pisco Quebranta haut de gamme, citron vert frais, sirop artisanal, mousse veloutée et gouttes d'Angostura." },
          pt: { name: "Pisco Sour Catedral", desc: "Pisco Quebranta selecionado, limão fresco, xarope artesanal, clara de ovo batida e gotas aromáticas." }
        }
      }
    ];

    let currentEditingId = null;
    let modalLang = "es";
    let modalTempI18n = {};
    let activeDishReviewsId = null;

    function init() {
      cargarConfigLocal();
      renderizarDishesGrid();
      actualizarEstadisticas();
      actualizarQRImprimible();
    }

    // CARGA Y GUARDADO DE AJUSTES GLOBALES
    function cargarConfigLocal() {
      const savedCfg = localStorage.getItem("inka_bistro_config");
      if (savedCfg) {
        CONFIG = JSON.parse(savedCfg);
        document.getElementById("cfgWhatsApp").value = CONFIG.whatsapp;
        document.getElementById("cfgYapePhone").value = CONFIG.yapePhone;
        document.getElementById("cfgExchangeRate").value = CONFIG.exchangeRateUSD;
      }

      const savedMenu = localStorage.getItem("inka_bistro_menu");
      if (savedMenu) {
        catalogo = JSON.parse(savedMenu);
      }
    }

    function guardarConfiguracion() {
      CONFIG.whatsapp = document.getElementById("cfgWhatsApp").value.trim();
      CONFIG.yapePhone = document.getElementById("cfgYapePhone").value.trim();
      CONFIG.exchangeRateUSD = parseFloat(document.getElementById("cfgExchangeRate").value) || 3.75;

      localStorage.setItem("inka_bistro_config", JSON.stringify(CONFIG));
      alert("Ajustes de restaurante y cobro guardados con éxito.");
      renderizarDishesGrid();
    }

    function persistirMenu() {
      localStorage.setItem("inka_bistro_menu", JSON.stringify(catalogo));
    }

    // ACTUALIZACIÓN DE ESTADÍSTICAS
    function actualizarEstadisticas() {
      document.getElementById("statTotalDishes").innerText = catalogo.length;
      document.getElementById("statSpecialties").innerText = catalogo.filter(d => d.category === "top").length;
      document.getElementById("statDrinks").innerText = catalogo.filter(d => d.category === "drinks").length;
    }

    // RENDERIZADO DE PLATOS
    function renderizarDishesGrid() {
      const grid = document.getElementById("dishesGrid");
      grid.innerHTML = "";

      catalogo.forEach((dish) => {
        const es = dish.i18n.es || {};
        const usdPrice = (dish.precioPEN / CONFIG.exchangeRateUSD).toFixed(2);
        const reviewsCount = dish.reviews ? dish.reviews.length : 0;

        const card = document.createElement("div");
        card.className = "dish-admin-card";
        card.innerHTML = `
          <div class="dish-media-header">
            <img src="${dish.posterUrl || 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500'}" alt="${es.name}" />
            <span class="dish-category-badge">${dish.category}</span>
            ${dish.tag ? `<span class="dish-tag-badge">${dish.tag}</span>` : ""}
          </div>

          <div class="dish-admin-body">
            <div class="dish-admin-title">${es.name}</div>
            <div class="dish-admin-desc">${es.desc}</div>

            <div class="dish-admin-prices">
              <span class="price-pen">S/ ${dish.precioPEN.toFixed(2)}</span>
              <span class="price-usd">≈ $ ${usdPrice} USD</span>
            </div>

            <div class="dish-admin-reviews-badge" onclick="abrirModalReseñas('${dish.id}')">
              <i class="fa-solid fa-comments"></i> ${reviewsCount} reseñas verificadas
            </div>
          </div>

          <div class="dish-admin-footer">
            <span style="font-size:12px; color:#aaa;"><i class="fa-solid fa-heart" style="color:#ef4444;"></i> ${dish.likes}</span>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="abrirModalPlato('${dish.id}')">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" onclick="eliminarPlato('${dish.id}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      actualizarEstadisticas();
    }

    // MODAL DE CREACIÓN / EDICIÓN MULTILINGÜE
    function abrirModalPlato(id = null) {
      currentEditingId = id;
      modalLang = "es";

      if (id) {
        const dish = catalogo.find(d => d.id === id);
        document.getElementById("modalDishTitle").innerText = "Editar Plato";
        document.getElementById("inputDishPrice").value = dish.precioPEN;
        document.getElementById("inputDishCategory").value = dish.category;
        document.getElementById("inputDishTag").value = dish.tag || "";
        document.getElementById("inputDishLikes").value = dish.likes || 100;
        document.getElementById("inputDishVideo").value = dish.videoUrl;
        document.getElementById("inputDishPoster").value = dish.posterUrl;
        modalTempI18n = JSON.parse(JSON.stringify(dish.i18n));
      } else {
        document.getElementById("modalDishTitle").innerText = "Nuevo Plato";
        document.getElementById("inputDishPrice").value = "";
        document.getElementById("inputDishCategory").value = "top";
        document.getElementById("inputDishTag").value = "";
        document.getElementById("inputDishLikes").value = "100";
        document.getElementById("inputDishVideo").value = "";
        document.getElementById("inputDishPoster").value = "";
        modalTempI18n = {
          es: { name: "", desc: "" },
          en: { name: "", desc: "" },
          fr: { name: "", desc: "" },
          pt: { name: "", desc: "" }
        };
      }

      cargarCamposIdioma();
      document.getElementById("dishModal").classList.add("active");
    }

    function cerrarModalPlato() {
      document.getElementById("dishModal").classList.remove("active");
    }

    function switchLangTab(lang) {
      guardarCamposIdiomaActual();
      modalLang = lang;

      document.querySelectorAll(".lang-tab-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");

      cargarCamposIdioma();
    }

    function guardarCamposIdiomaActual() {
      if (!modalTempI18n[modalLang]) modalTempI18n[modalLang] = {};
      modalTempI18n[modalLang].name = document.getElementById("inputDishName").value.trim();
      modalTempI18n[modalLang].desc = document.getElementById("inputDishDesc").value.trim();
    }

    function cargarCamposIdioma() {
      const data = modalTempI18n[modalLang] || { name: "", desc: "" };
      document.getElementById("lblDishName").innerText = `Nombre del Plato (${modalLang.toUpperCase()})`;
      document.getElementById("lblDishDesc").innerText = `Descripción (${modalLang.toUpperCase()})`;
      document.getElementById("inputDishName").value = data.name || "";
      document.getElementById("inputDishDesc").value = data.desc || "";
    }

    function guardarPlato() {
      guardarCamposIdiomaActual();

      const price = parseFloat(document.getElementById("inputDishPrice").value);
      if (isNaN(price) || price <= 0) {
        alert("Por favor ingresa un precio válido en Soles (PEN).");
        return;
      }

      if (!modalTempI18n.es.name) {
        alert("El plato debe tener al menos un nombre en español.");
        return;
      }

      // Copia de respaldo para idiomas vacíos
      ["en", "fr", "pt"].forEach(l => {
        if (!modalTempI18n[l].name) modalTempI18n[l].name = modalTempI18n.es.name;
        if (!modalTempI18n[l].desc) modalTempI18n[l].desc = modalTempI18n.es.desc;
      });

      const platoData = {
        id: currentEditingId || `dish-${Date.now()}`,
        category: document.getElementById("inputDishCategory").value,
        tag: document.getElementById("inputDishTag").value.trim(),
        precioPEN: price,
        likes: parseInt(document.getElementById("inputDishLikes").value) || 100,
        videoUrl: document.getElementById("inputDishVideo").value.trim() || "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        posterUrl: document.getElementById("inputDishPoster").value.trim() || "https://images.unsplash.com/photo-1544025162-d76694265947?w=800",
        i18n: modalTempI18n
      };

      if (currentEditingId) {
        const idx = catalogo.findIndex(d => d.id === currentEditingId);
        platoData.reviews = catalogo[idx].reviews || [];
        catalogo[idx] = platoData;
      } else {
        platoData.reviews = [];
        catalogo.push(platoData);
      }

      persistirMenu();
      cerrarModalPlato();
      renderizarDishesGrid();
    }

    function eliminarPlato(id) {
      if (confirm("¿Estás seguro de que deseas eliminar este plato del catálogo?")) {
        catalogo = catalogo.filter(d => d.id !== id);
        persistirMenu();
        renderizarDishesGrid();
      }
    }

    // MODAL Y GESTIÓN DE RESEÑAS
    function abrirModalReseñas(id) {
      activeDishReviewsId = id;
      const dish = catalogo.find(d => d.id === id);
      if (!dish) return;

      document.getElementById("reviewsModalTitle").innerText = `Reseñas: ${dish.i18n.es.name}`;
      const container = document.getElementById("reviewsListAdmin");
      container.innerHTML = "";

      if (dish.reviews && dish.reviews.length > 0) {
        dish.reviews.forEach((r, idx) => {
          const item = document.createElement("div");
          item.className = "review-admin-item";
          item.innerHTML = `
            <div>
              <div style="font-size:12px; font-weight:800; color:#fbbf24;">${r.author} • ${'⭐'.repeat(r.rating || 5)}</div>
              <p style="font-size:12px; color:#eee; margin-top:3px;">${r.text}</p>
            </div>
            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="eliminarReseña(${idx})">
              <i class="fa-solid fa-trash"></i>
            </button>
          `;
          container.appendChild(item);
        });
      } else {
        container.innerHTML = `<p style="font-size:12px; color:#aaa; text-align:center; padding:16px;">Este plato no tiene reseñas aún.</p>`;
      }

      document.getElementById("reviewsAdminModal").classList.add("active");
    }

    function cerrarModalReseñas() {
      document.getElementById("reviewsAdminModal").classList.remove("active");
    }

    function eliminarReseña(idx) {
      const dish = catalogo.find(d => d.id === activeDishReviewsId);
      if (dish && dish.reviews) {
        dish.reviews.splice(idx, 1);
        persistirMenu();
        abrirModalReseñas(activeDishReviewsId);
        renderizarDishesGrid();
      }
    }

    // GENERADOR E IMPRESIÓN DE QR POR MESA
    function actualizarQRImprimible() {
      const table = document.getElementById("qrTableInput").value.trim() || "Mesa 01";
      const baseUrl = document.getElementById("qrBaseUrlInput").value.trim() || "https://tudominio.com/menu/";
      const fullUrl = `${baseUrl}?mesa=${encodeURIComponent(table)}`;

      document.getElementById("qrTableLabel").innerText = table;
      document.getElementById("qrGeneratedImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(fullUrl)}`;
    }

    function imprimirQRMesa() {
      const printContents = document.getElementById("qrPrintArea").outerHTML;
      const originalContents = document.body.innerHTML;

      document.body.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
          <h2 style="margin-bottom:10px; color:#000;">Inka Bistro Cusco</h2>
          ${printContents}
          <p style="font-size:12px; color:#555; margin-top:8px;">Escanea para ver la carta y pedir desde tu celular</p>
        </div>
      `;
      window.print();
      document.body.innerHTML = originalContents;
      window.location.reload();
    }

    // EXPORTADOR JSON
    function exportarJSON() {
      const exportData = {
        restaurante: "Inka Bistro Cusco",
        config: CONFIG,
        catalogo: catalogo
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "productos.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
