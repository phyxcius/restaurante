<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inka Bistro - Panel de Control & Administración</title>
  <style>
    :root {
      --bg: #110e0c;
      --card: #1c1815;
      --primary: #f59e0b;
      --border: #332b25;
      --text: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .grid-admin {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    @media (max-width: 860px) {
      .grid-admin { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #d1d5db;
    }

    input, textarea {
      width: 100%;
      background: #0d0a08;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    small {
      display: block;
      color: #9ca3af;
      font-size: 0.75rem;
      margin-top: 4px;
    }

    button.btn-primary {
      width: 100%;
      background: var(--primary);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Tabla de platos */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: #9ca3af;
      font-weight: 600;
    }

    .badge-media {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-video { background: #7c2d12; color: #fdba74; }
    .badge-foto { background: #1e3a8a; color: #93c5fd; }

    /* Feed de Respuestas de Clientes */
    .log-feed {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .log-item {
      background: #25201b;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
      font-size: 0.85rem;
    }

    .log-item.verde {
      border-left-color: #22c55e;
    }
  </style>
</head>
<body>

  <header>
    <h1>Panel de Control de Pedidos & Catálogo</h1>
    <button class="btn-primary" style="width: auto;" onclick="enviarAlertaMesa()">🔔 Preguntar a Mesa 09</button>
  </header>

  <div class="grid-admin">
    <!-- Columna Izquierda: Formulario de Catálogo -->
    <div class="panel-card">
      <div class="panel-title">Agregar / Configurar Plato</div>
      <form id="formPlato" onsubmit="guardarPlato(event)">
        <div class="form-group">
          <label>Nombre del Plato:</label>
          <input type="text" id="nombrePlato" placeholder="Ej. Lomo Saltado Criollo" required>
        </div>

        <div class="form-group">
          <label>Descripción:</label>
          <textarea id="descPlato" rows="2" placeholder="Ingredientes y detalles..." required></textarea>
        </div>

        <div class="form-group">
          <label>Precio (S/):</label>
          <input type="number" step="0.5" id="precioPlato" placeholder="35.00" required>
        </div>

        <div class="form-group">
          <label>URL Imagen (Poster/Portada):</label>
          <input type="url" id="imgPlato" placeholder="https://dominio.com/foto.jpg" required>
        </div>

        <div class="form-group">
          <label>URL Video del Catálogo (Opcional):</label>
          <input type="url" id="videoPlato" placeholder="https://dominio.com/video.mp4">
          <small>Recomendado: Archivo .mp4 (H.264), 1-3 MB, proporción 9:16 o 1:1 en bucle.</small>
        </div>

        <button type="submit" class="btn-primary">+ Guardar en Catálogo</button>
      </form>
    </div>

    <!-- Columna Derecha: Catálogo actual y Respuestas en vivo -->
    <div>
      <div class="panel-card" style="margin-bottom: 24px;">
        <div class="panel-title">Platos en el Catálogo</div>
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Tipo de Medio</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaPlatos"></tbody>
        </table>
      </div>

      <div class="panel-card">
        <div class="panel-title">Respuestas en Vivo desde las Mesas</div>
        <div id="logFeed" class="log-feed">
          <div class="log-item">Esperando respuestas del cliente...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canalAdmin = new BroadcastChannel('canal_inka_pedidos');

    // Reproducción de alerta sonora en el panel
    function reproducirSonidoAdmin() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    function cargarPlatosAdmin() {
      const tbody = document.getElementById('tablaPlatos');
      const almacenados = localStorage.getItem('inka_catalogo');
      const platos = almacenados ? JSON.parse(almacenados) : [];

      tbody.innerHTML = platos.map((p, idx) => `
        <tr>
          <td><strong>${p.nombre}</strong></td>
          <td>S/ ${parseFloat(p.precio).toFixed(2)}</td>
          <td>
            ${p.video && p.video.trim() !== '' 
              ? '<span class="badge-media badge-video">📹 Video MP4</span>' 
              : '<span class="badge-media badge-foto">🖼️ Imagen</span>'}
          </td>
          <td>
            <button onclick="eliminarPlato(${idx})" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:6px; cursor:pointer;">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    function guardarPlato(e) {
      e.preventDefault();
      const nuevo = {
        id: "p_" + Date.now(),
        nombre: document.getElementById('nombrePlato').value,
        descripcion: document.getElementById('descPlato').value,
        precio: document.getElementById('precioPlato').value,
        imagen: document.getElementById('imgPlato').value,
        video: document.getElementById('videoPlato').value.trim()
      };

      const almacenados = localStorage.getItem('inka_catalogo');
      const platos = almacenados ? JSON.parse(almacenados) : [];
      platos.unshift(nuevo);

      localStorage.setItem('inka_catalogo', JSON.stringify(platos));
      canalAdmin.postMessage({ tipo: 'CATALOGO_ACTUALIZADO' });

      document.getElementById('formPlato').reset();
      cargarPlatosAdmin();
    }

    function eliminarPlato(indice) {
      const almacenados = localStorage.getItem('inka_catalogo');
      let platos = almacenados ? JSON.parse(almacenados) : [];
      platos.splice(indice, 1);
      localStorage.setItem('inka_catalogo', JSON.stringify(platos));
      canalAdmin.postMessage({ tipo: 'CATALOGO_ACTUALIZADO' });
      cargarPlatosAdmin();
    }

    function enviarAlertaMesa() {
      canalAdmin.postMessage({ tipo: 'SOLICITUD_MOZO' });
      alert("Se envió la solicitud a la mesa del cliente.");
    }

    // Recepción de respuestas en vivo desde index.html
    canalAdmin.onmessage = (event) => {
      if (event.data?.tipo === 'RESPUESTA_CLIENTE') {
        reproducirSonidoAdmin();
        const feed = document.getElementById('logFeed');
        const esSi = event.data.respuesta.includes("Desea agregar");
        const nuevoLog = `
          <div class="log-item ${esSi ? 'verde' : ''}">
            <strong>${event.data.mesa}</strong> - ${event.data.hora}<br>
            <span>${event.data.respuesta}</span>
          </div>
        `;
        feed.innerHTML = nuevoLog + feed.innerHTML;
      }
    };

    window.addEventListener('DOMContentLoaded', cargarPlatosAdmin);
  </script>
</body>
</html>
