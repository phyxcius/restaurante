<!DOCTYPE html> 
<html lang="es"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Panel de Control & TPV | La Cusqueñita</title> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
  <style> 
    :root { 
      --primary: #c2410c; 
      --accent: #f59e0b; 
      --bg-dark: #120c0a; 
      --sidebar-bg: #1c1310; 
      --card-bg: #221814; 
      --card-border: rgba(245, 158, 11, 0.22); 
      --input-bg: #160e0b; 
      --text-main: #fffdfa; 
      --text-muted: #d1c7be; 
      --gold: #fbbf24; 
      --danger: #ef4444; 
      --success: #16a34a; 
      --blue: #0284c7; 
    } 

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; } 
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; } 

    /* PANTALLA LOGIN */ 
    #pantallaLogin { 
      display: flex; justify-content: center; align-items: center; min-height: 100vh; 
      padding: 16px; background: radial-gradient(circle at center, #241611 0%, #0d0806 100%); 
    } 
    .card-login { 
      background: var(--card-bg); border: 1.5px solid var(--accent); border-radius: 18px; 
      max-width: 430px; width: 100%; padding: 26px 22px; box-shadow: 0 10px 35px rgba(0,0,0,0.8); 
    } 
    .card-login h3 { color: var(--gold); text-align: center; margin-bottom: 4px; font-size: 20px; font-weight: 900; } 
    .card-login p.sub { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 16px; } 

    /* LOGO OFICIAL LA CHUSPA TECH EN LOGIN */
    .login-chuspa-logo-wrap {
      width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 50%;
      background: #fff; border: 2.5px solid var(--gold); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
    }
    .login-chuspa-logo-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .caja-chica-box { 
      background: #180e0a; border: 1.5px dashed var(--accent); border-radius: 10px; 
      padding: 12px; margin-top: 10px; 
    } 

    /* BARRA SUPERIOR */ 
    .top-admin-bar { 
      display: flex; background: #190f0c; border-bottom: 1.5px solid var(--card-border); 
      padding: 8px 14px; align-items: center; justify-content: space-between; 
      position: sticky; top: 0; z-index: 150; width: 100%; transition: background-color 0.4s ease; 
    } 
    .top-admin-bar.alerta-nueva-orden { 
      background-color: #854d0e !important; 
      animation: alertFlash 1s infinite alternate; 
    } 
    @keyframes alertFlash { 0% { border-bottom-color: #ef4444; } 100% { border-bottom-color: #fde047; } } 

    .btn-toggle-global { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: #fff; border: 1px solid var(--gold); border-radius: 8px; 
      padding: 7px 12px; font-size: 13px; font-weight: 800; cursor: pointer; 
      display: inline-flex; align-items: center; gap: 6px; 
    } 

    .top-brand-center { display: flex; align-items: center; gap: 10px; } 
    .top-chuspa-badge { 
      display: flex; align-items: center; gap: 6px; 
      background: rgba(254, 252, 232, 0.12); border: 1px solid rgba(234, 179, 8, 0.45); 
      padding: 3px 8px 3px 5px; border-radius: 20px; text-decoration: none; 
    } 
    .top-chuspa-badge img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #fff; } 

    .admin-layout { 
      display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 54px); width: 100%; 
      transition: grid-template-columns 0.25s ease; position: relative; 
    } 
    .admin-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; } 
    .admin-layout.sidebar-collapsed .sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; visibility: hidden; } 

    .sidebar { 
      background: var(--sidebar-bg); border-right: 1.5px solid var(--card-border); 
      padding: 18px 14px; display: flex; flex-direction: column; gap: 10px; 
      position: sticky; top: 54px; height: calc(100vh - 54px); overflow-y: auto; z-index: 200; width: 290px; 
      transition: transform 0.25s ease, opacity 0.25s ease; 
    } 

    .brand-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); } 
    .brand-left { display: flex; align-items: center; gap: 10px; overflow: hidden; } 
    .brand-avatar { 
      width: 44px; height: 44px; border-radius: 12px; 
      background: linear-gradient(135deg, var(--accent), var(--primary)); 
      display: flex; align-items: center; justify-content: center; 
      font-size: 22px; color: #fff; overflow: hidden; flex-shrink: 0;
      border: 1.5px solid var(--gold);
    } 
    .brand-avatar img { width: 100%; height: 100%; object-fit: cover; } 

    .user-session-badge { 
      background: rgba(245, 158, 11, 0.12); border: 1px solid var(--card-border); 
      border-radius: 8px; padding: 7px 10px; font-size: 11.5px; 
      display: flex; justify-content: space-between; align-items: center; 
    } 

    /* ACORDEONES DEL VAULT */ 
    .vault-box { background: #251a15; border: 1.5px dashed var(--accent); border-radius: 10px; overflow: hidden; margin-bottom: 4px; } 
    .vault-box.danger-vault { border-color: #ef4444; background: #221212; } 
    .vault-trigger { width: 100%; background: none; border: none; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 800; color: var(--gold); font-size: 11px; } 
    .vault-box.danger-vault .vault-trigger { color: #fca5a5; } 
    .vault-content { display: none; padding: 10px 12px; background: #18100c; border-top: 1px solid rgba(255,255,255,0.08); } 
    .vault-content input { width: 100%; padding: 7px; background: #110907; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 12px; margin-top: 4px; outline: none; } 

    .nav-menu { display: flex; flex-direction: column; gap: 6px; flex: 1; } 
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 700; cursor: pointer; text-align: left; } 
    .nav-item i { font-size: 15px; width: 20px; text-align: center; color: var(--accent); } 
    .nav-item:hover { background: #281c17; color: #fff; } 
    .nav-item.active { background: #38241b; color: var(--gold); border-color: var(--card-border); } 
    .badge-live-orders { background: #ef4444; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 12px; margin-left: auto; } 

    .main-view { padding: 20px 24px; overflow-y: auto; max-height: calc(100vh - 54px); width: 100%; } 
    .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; border-bottom: 1.5px solid rgba(255,255,255,0.08); padding-bottom: 12px; } 
    .view-header h1 { font-size: 21px; font-weight: 900; color: var(--gold); } 

    .card { background: var(--card-bg); padding: 18px 20px; border-radius: 14px; border: 1px solid var(--card-border); margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); } 
    label { font-size: 11px; font-weight: 800; color: var(--gold); display: block; margin-top: 8px; text-transform: uppercase; } 
    input, textarea, select { width: 100%; padding: 9px 12px; margin-top: 4px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; font-size: 13.5px; background: var(--input-bg); color: #fff; outline: none; } 

    .btn { padding: 9px 14px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; } 
    .btn-save { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; } 
    .btn-add { background: var(--success); color: white; } 
    .btn-del { background: #451a1a; color: #fca5a5; border: 1px solid #dc2626; } 
    .btn-print { background: var(--blue); color: #fff; } 
    .btn-wa { background: #15803d; color: #fff; border: 1px solid #4ade80; }

    /* ESTILOS DEL CRM MENSUAL DE RESERVAS */
    .crm-calendar-wrapper {
      background: #18100c; border: 1.5px solid var(--card-border);
      border-radius: 16px; padding: 18px; margin-top: 10px;
    }
    .crm-calendar-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
    }
    .crm-calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    }
    .crm-day-head {
      text-align: center; font-size: 11.5px; font-weight: 900; color: var(--gold);
      padding: 8px 4px; background: #251a15; border-radius: 6px; text-transform: uppercase;
    }
    .crm-calendar-cell {
      min-height: 110px; background: #221612; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 4px;
      cursor: pointer; transition: background 0.15s ease;
    }
    .crm-calendar-cell:hover { background: #2f1d16; border-color: var(--accent); }
    .crm-cell-number { font-size: 12px; font-weight: 900; color: #aaa; margin-bottom: 2px; }
    .crm-cell-today { border: 2px solid var(--gold); }
    .crm-reserva-badge {
      font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .res-pendiente { background: #d97706; color: #fff; }
    .res-confirmada { background: #16a34a; color: #fff; }

    .kds-calendar-bar { 
      background: #180e0a; border: 1.5px solid var(--accent); border-radius: 14px; 
      padding: 12px 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; 
      justify-content: space-between; align-items: center; gap: 12px; 
    } 
    .kds-date-picker-wrap { display: flex; align-items: center; gap: 8px; } 
    .kds-date-input { 
      padding: 7px 12px; border-radius: 8px; border: 1px solid var(--gold); 
      background: #110907; color: #fde047; font-weight: 900; font-size: 13px; cursor: pointer; 
    } 
    .kds-date-quick-btn { 
      background: #2b1c16; border: 1px solid rgba(245, 158, 11, 0.35); color: #fed7aa; 
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; 
    } 
    .kds-date-quick-btn.active { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: var(--gold); 
    } 

    .kds-day-metrics { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; } 
    .metric-pill { 
      background: #221510; border: 1px solid rgba(255,255,255,0.08); padding: 5px 10px; 
      border-radius: 8px; font-size: 11.5px; 
    } 
    .metric-pill b { color: var(--gold); font-size: 13px; } 

    .kds-search-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; } 
    .kds-search-bar input { flex: 2; min-width: 200px; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); background: #180e0a; color: #fff; } 
    .kds-filter-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid #555; background: #221814; color: #ddd; font-size: 12px; font-weight: bold; cursor: pointer; } 
    .kds-filter-btn.active { background: var(--primary); color: #fff; border-color: var(--accent); } 

    .tables-monitor-bar { 
      background: #1a110e; border: 1.5px solid var(--card-border); border-radius: 14px; 
      padding: 12px 14px; margin-bottom: 16px; 
    } 
    .tables-monitor-header { 
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; 
      font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--gold); flex-wrap: wrap; gap: 8px; 
    } 
    .tables-monitor-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } 
    .tables-monitor-grid { 
      display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 6px; min-height: 40px; 
    } 
    .table-pill { 
      padding: 7px 4px; text-align: center; border-radius: 7px; font-size: 11.5px; font-weight: 800; 
      border: 1.5px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; 
      gap: 4px; position: relative; transition: transform 0.15s ease; 
    } 
    .table-pill:hover { transform: scale(1.03); } 
    .table-pill.libre { background: rgba(22, 163, 74, 0.15); border-color: #16a34a; color: #86efac; } 
    .table-pill.ocupada { background: rgba(220, 38, 38, 0.25); border-color: #dc2626; color: #fca5a5; } 
    .btn-remove-pill { 
      background: #ef4444; color: #fff; border: none; border-radius: 50%; width: 16px; height: 16px; 
      display: inline-flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; 
    } 

    .live-orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; min-height: 60px; } 
    .order-card { 
      border-radius: 14px; border: 2.5px solid transparent; 
      padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
      position: relative; transition: all 0.3s ease; 
    } 
    .order-card.estado-iniciado { background: #2b1f0c; border-color: #f59e0b; } 
    .order-card.estado-cocina { background: #0f2333; border-color: #0284c7; } 
    .order-card.estado-servido { background: #0e2918; border-color: #16a34a; } 
    .order-card.estado-finalizado { background: #1e1e1e; border-color: #6b7280; opacity: 0.88; } 

    .order-card.cliente-pagando { 
      border-color: #ec4899 !important; 
      box-shadow: 0 0 25px #ec4899, 0 0 10px #3b82f6 !important; 
      animation: rainbowSpin 3s linear infinite alternate; 
    } 
    @keyframes rainbowSpin { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } } 

    .order-card-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed rgba(255,255,255,0.12); padding-bottom: 8px; } 
    .order-status-badge { font-size: 11px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; } 
    .badge-iniciado { background: #f59e0b; color: #000; } 
    .badge-cocina { background: #0284c7; color: #fff; } 
    .badge-servido { background: #16a34a; color: #fff; } 
    .badge-finalizado { background: #4b5563; color: #e5e7eb; } 

    .chef-order-priority-badge { 
      background: #78350f; color: #fde047; border: 1.5px solid #f59e0b; 
      font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; 
    } 

    .order-items-box { font-size: 14px; font-weight: 800; color: #fde047; line-height: 1.4; padding: 4px 0; } 
    .order-notes-tag { font-size: 12px; color: #fca5a5; background: rgba(0,0,0,0.3); padding: 5px 8px; border-radius: 6px; border-left: 3px solid #f87171; } 
    .order-bottom-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 8px; font-size: 12.5px; } 

    .order-actions-container { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; } 
    .btn-action-confirm { flex: 1; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; padding: 9px; font-size: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; } 
    .btn-action-serve { flex: 1; background: linear-gradient(135deg, #16a34a, #22c55e); color: #fff; padding: 9px; font-size: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; } 
    .btn-action-cobrar { flex: 1; background: linear-gradient(135deg, #b45309, #f59e0b); color: #000; padding: 9px; font-size: 12px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; } 
    .btn-action-ask-more { width: 100%; background: #ca8a04; color: #fff; padding: 8px; font-size: 12px; border-radius: 7px; border: none; font-weight: 800; cursor: pointer; } 
    .btn-action-print-chef { width: 100%; background: #0284c7; color: #fff; padding: 8px; font-size: 12px; border-radius: 7px; border: none; font-weight: 800; cursor: pointer; } 

    .custom-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; } 
    .custom-table th, .custom-table td { border: 1px solid rgba(255,255,255,0.1); padding: 8px 10px; } 
    .custom-table th { background: #2f221c; color: var(--gold); } 

    .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; } 
    .dish-card-visual { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; } 
    .dish-media { height: 160px; background: #000; overflow: hidden; position: relative; } 
    .dish-media img, .dish-media video { width: 100%; height: 100%; object-fit: cover; } 
    .badge-media-type { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fde047; font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: bold; border: 1px solid var(--accent); } 
    .switch-btn { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; border: none; cursor: pointer; } 
    .switch-btn.btn-to-off { background: #451a1a; color: #fca5a5; border: 1px solid #dc2626; } 
    .switch-btn.btn-to-on { background: #14532d; color: #86efac; border: 1px solid #16a34a; } 

    /* MODALES FLOTANTES */ 
    .modal-overlay { 
      position: fixed !important; inset: 0 !important; background: rgba(0,0,0,0.85) !important; 
      backdrop-filter: blur(6px) !important; z-index: 999999 !important; 
      display: none !important; align-items: center !important; justify-content: center !important; 
      padding: 16px !important; 
    } 
    .modal-overlay.active { 
      display: flex !important; 
    } 
    .modal-box { 
      background: var(--card-bg) !important; border: 1.5px solid var(--card-border) !important; 
      border-radius: 16px !important; max-width: 520px !important; width: 100% !important; 
      max-height: 90vh !important; overflow-y: auto !important; padding: 22px !important; 
      display: flex !important; flex-direction: column !important; gap: 12px !important; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.95) !important; 
    } 

    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 180; } 

    /* ======================================================== 
       MODAL DE ALERTA CENTRADO (SEGUNDO PLANO A PRIMER PLANO) 
       ======================================================== */ 
    .alerta-centro-overlay { 
      position: fixed; inset: 0; 
      background: rgba(0, 0, 0, 0.78); 
      backdrop-filter: blur(6px); 
      z-index: 1000000; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      padding: 16px; 
    } 
    .alerta-centro-overlay.active { display: flex; } 
    .alerta-centro-card { 
      position: relative; width: 100%; max-width: 440px; 
      background: #19120e; border-radius: 20px; padding: 22px; 
      overflow: hidden; box-shadow: 0 10px 45px rgba(0,0,0,0.9); 
      border: 2px solid var(--gold); 
      animation: alertPulseGlow 2.5s infinite alternate ease-in-out; 
      text-align: center; 
    } 
    @keyframes alertPulseGlow { 
      0% { box-shadow: 0 0 18px rgba(245, 158, 11, 0.4), 0 0 35px rgba(239, 68, 68, 0.2); } 
      100% { box-shadow: 0 0 38px rgba(245, 158, 11, 0.8), 0 0 60px rgba(239, 68, 68, 0.5); } 
    } 
    .alerta-icono-wrap { 
      width: 64px; height: 64px; border-radius: 50%; 
      background: rgba(245, 158, 11, 0.15); border: 2px solid var(--g
