<!DOCTYPE html> 
<html lang="es"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Panel de Control & TPV Enterprise | La Cusqueñita</title> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
  <style> 
    :root { 
      --primary: #0056d2; 
      --primary-hover: #0043a8;
      --accent: #0284c7; 
      --accent-glow: rgba(0, 86, 210, 0.4);
      --chuspa-gold: #f59e0b;
      --chuspa-gold-glow: rgba(245, 158, 11, 0.35);
      --chuspa-gold-border: rgba(245, 158, 11, 0.38);
      --bg-dark: #050d1a; 
      --sidebar-bg: #081427; 
      --card-bg: #0b1a33; 
      --card-border: rgba(56, 189, 248, 0.18); 
      --input-bg: #050e1c; 
      --text-main: #f8fafc; 
      --text-muted: #94a3b8; 
      --gold: #38bdf8;
      --danger: #dc2626;
      --success: #10b981;
      --blue: #2563eb; 
      --header-bg: #071224;
      --metric-bg: #0a172e;
    } 

    body.light-theme {
      --bg-dark: #f4f7fb;
      --sidebar-bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --chuspa-gold-border: rgba(217, 119, 6, 0.45);
      --input-bg: #f8fafc;
      --text-main: #0f172a; 
      --text-muted: #334155; 
      --gold: #0056d2; 
      --header-bg: #ffffff;
      --metric-bg: #eef4fc;
    }

    body.light-theme .top-admin-bar { background: #ffffff !important; border-bottom: 2px solid #cbd5e1 !important; }
    body.light-theme #topBarTitle, body.light-theme #headerBusinessName, body.light-theme .view-header h1, body.light-theme .card-login h3 { color: #0f172a !important; font-weight: 900 !important; }
    body.light-theme .sidebar { background: #ffffff !important; border-right: 1.5px solid #cbd5e1 !important; }
    body.light-theme .card, body.light-theme .modal-box, body.light-theme .card-login { background: #ffffff !important; border: 1.5px solid #cbd5e1 !important; }
    body.light-theme label { color: #0056d2 !important; }
    body.light-theme input, body.light-theme textarea, body.light-theme select { background: #ffffff !important; color: #0f172a !important; border: 1.5px solid #cbd5e1 !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } 
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; } 

    .btn-theme-toggle-floating {
      position: fixed; top: 10px; right: 70px; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; z-index: 9999999; background: linear-gradient(90deg, #ffffff 50%, #081427 50%);
      border: 2px solid var(--chuspa-gold); display: flex; align-items: center; justify-content: center; outline: none; padding: 0;
    }

    #pantallaLogin { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; background: radial-gradient(circle at center, #0c2042 0%, #020712 100%); } 
    .card-login { background: var(--card-bg); border: 1.5px solid var(--chuspa-gold-border); border-radius: 20px; max-width: 440px; width: 100%; padding: 30px 26px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); } 
    .card-login h3 { color: #f8fafc; text-align: center; margin-bottom: 4px; font-size: 22px; font-weight: 900; } 
    .card-login p.sub { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 20px; } 

    .login-logos-header { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
    .login-chuspa-logo-wrap { width: 66px; height: 66px; border-radius: 50%; background: #fff; border: 2.5px solid var(--chuspa-gold); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .login-chuspa-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .login-brand-logo-wrap { width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(135deg, #0056d2, #0284c7); border: 2.5px solid var(--chuspa-gold); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
    .login-brand-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .caja-chica-box { background: rgba(0, 86, 210, 0.08); border: 1.5px dashed var(--chuspa-gold); border-radius: 12px; padding: 14px; margin-top: 12px; } 

    .top-admin-bar { display: flex; background: var(--header-bg); border-bottom: 1.5px solid var(--chuspa-gold-border); padding: 10px 18px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 150; width: 100%; } 
    .btn-toggle-global { background: linear-gradient(135deg, #0056d2, #0284c7); color: #fff; border: 1px solid var(--chuspa-gold); border-radius: 8px; padding: 8px 15px; font-size: 13px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; } 
    .top-brand-center { display: flex; align-items: center; gap: 12px; } 
    .top-chuspa-badge { display: flex; align-items: center; gap: 7px; background: rgba(245, 158, 11, 0.12); border: 1.5px solid var(--chuspa-gold); padding: 4px 11px 4px 6px; border-radius: 20px; text-decoration: none; } 
    .top-chuspa-badge img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #fff; } 
    .top-chuspa-badge span { font-size: 10.5px; font-weight: 900; color: #fbbf24; }

    .admin-layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 54px); width: 100%; position: relative; } 
    .sidebar { background: var(--sidebar-bg); border-right: 1.5px solid var(--card-border); padding: 18px 14px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 54px; height: calc(100vh - 54px); overflow-y: auto; z-index: 200; width: 290px; } 

    .brand-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); } 
    .brand-left { display: flex; align-items: center; gap: 10px; overflow: hidden; } 
    .brand-avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #0056d2, #0284c7); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; border: 1.5px solid var(--chuspa-gold); flex-shrink: 0; } 
    .brand-avatar img { width: 100%; height: 100%; object-fit: cover; } 

    .user-session-badge { background: rgba(0, 86, 210, 0.12); border: 1px solid var(--chuspa-gold-border); border-radius: 10px; padding: 8px 12px; font-size: 11.5px; display: flex; justify-content: space-between; align-items: center; } 

    .nav-menu { display: flex; flex-direction: column; gap: 6px; flex: 1; } 
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 700; cursor: pointer; text-align: left; border: none; width: 100%; } 
    .nav-item i { font-size: 15px; width: 20px; text-align: center; color: var(--accent); } 
    .nav-item:hover { background: #0d2042; color: #fff; } 
    .nav-item.active { background: #102954; color: #fbbf24; border: 1px solid var(--chuspa-gold-border); font-weight: 800; } 
    .badge-live-orders { background: #dc2626; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 12px; margin-left: auto; font-weight: 900; } 

    .main-view { padding: 24px 28px; overflow-y: auto; max-height: calc(100vh - 54px); width: 100%; } 
    .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1.5px solid rgba(255,255,255,0.08); padding-bottom: 12px; } 
    .view-header h1 { font-size: 22px; font-weight: 900; color: #f8fafc; } 

    .card { background: var(--card-bg); padding: 22px 24px; border-radius: 16px; border: 1px solid var(--card-border); margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); } 
    label { font-size: 11px; font-weight: 800; color: var(--gold); display: block; margin-top: 8px; text-transform: uppercase; } 
    input, textarea, select { width: 100%; padding: 10px 13px; margin-top: 4px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; font-size: 13.5px; background: var(--input-bg); color: #fff; outline: none; } 

    .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; } 
    .btn-save { background: linear-gradient(135deg, #0056d2, #0284c7); color: white; } 
    .btn-add { background: var(--success); color: white; } 
    .btn-del { background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; } 
    .btn-print { background: var(--blue); color: #fff; } 

    .kds-calendar-bar { background: var(--card-bg); border: 1.5px solid var(--chuspa-gold-border); border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; } 
    .kds-date-picker-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } 
    .kds-date-input { padding: 7px 12px; border-radius: 8px; border: 1.5px solid var(--chuspa-gold); background: #061122; color: #fbbf24; font-weight: 900; } 
    .kds-date-quick-btn { background: #0d2042; border: 1px solid rgba(56, 189, 248, 0.35); color: #bae6fd; padding: 6px 12px; border-radius: 6px; font-size: 11.5px; font-weight: 800; cursor: pointer; } 
    .kds-date-quick-btn.active { background: linear-gradient(135deg, #0056d2, #0284c7); color: #fff; border-color: var(--chuspa-gold); } 

    .kds-day-metrics { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; } 
    .metric-pill { background: var(--metric-bg); border: 1px solid rgba(255,255,255,0.08); padding: 7px 14px; border-radius: 10px; font-size: 12px; } 
    .metric-pill b { color: #fbbf24; font-size: 14px; } 

    .kds-search-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; } 
    .kds-search-bar input { flex: 2; min-width: 200px; padding: 11px; border-radius: 8px; border: 1px solid var(--accent); background: var(--input-bg); color: #fff; } 
    .kds-filter-btn { padding: 9px 15px; border-radius: 8px; border: 1px solid #334155; background: #0f2244; color: #cbd5e1; font-size: 12px; font-weight: bold; cursor: pointer; } 
    .kds-filter-btn.active { background: var(--primary); color: #fff; border-color: var(--chuspa-gold); } 

    .tables-monitor-bar { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 18px; } 
    .tables-monitor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; color: #fbbf24; } 
    .tables-monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 6px; min-height: 40px; } 
    .table-pill { padding: 8px 4px; text-align: center; border-radius: 7px; font-size: 11.5px; font-weight: 800; border: 1.5px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; } 
    .table-pill.libre { background: rgba(16, 185, 129, 0.18); border-color: #10b981; color: #6ee7b7; } 
    .table-pill.ocupada { background: rgba(220, 38, 38, 0.22); border-color: #dc2626; color: #fca5a5; } 

    .live-orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; min-height: 60px; } 
    .order-card { border-radius: 16px; border: 2px solid transparent; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); position: relative; } 
    .order-card.estado-iniciado { background: #1c1917; border-color: var(--chuspa-gold); } 
    .order-card.estado-cocina { background: #091b38; border-color: #0056d2; } 
    .order-card.estado-servido { background: #052617; border-color: #10b981; } 
    .order-card.estado-finalizado { background: #111a28; border-color: #475569; opacity: 0.88; } 

    .order-card-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed rgba(255,255,255,0.12); padding-bottom: 8px; } 
    .order-status-badge { font-size: 11px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; } 
    .badge-iniciado { background: var(--chuspa-gold); color: #000; } 
    .badge-cocina { background: #0056d2; color: #fff; } 
    .badge-servido { background: #10b981; color: #fff; } 
    .badge-finalizado { background: #475569; color: #e2e8f0; } 

    .chef-order-priority-badge { background: #003e9c; color: #bae6fd; border: 1px solid #38bdf8; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; } 
    .order-items-box { font-size: 14px; font-weight: 800; color: #e0f2fe; line-height: 1.4; padding: 4px 0; } 
    .order-notes-tag { font-size: 12px; color: #fca5a5; background: rgba(0,0,0,0.3); padding: 5px 8px; border-radius: 6px; border-left: 3px solid #dc2626; } 
    .order-bottom-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 8px; font-size: 12.5px; } 

    .order-actions-container { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; } 
    .btn-action-confirm { flex: 1; background: linear-gradient(135deg, #0056d2, #0284c7); color: #fff; padding: 10px; font-size: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; } 
    .btn-action-serve { flex: 1; background: linear-gradient(135deg, #10b981, #059669); color: #fff; padding: 10px; font-size: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; } 
    .btn-action-cobrar { flex: 1; background: linear-gradient(135deg, #dc2626, #ea580c); color: #fff; padding: 10px; font-size: 12px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; } 
    .btn-action-ask-more { width: 100%; background: #0284c7; color: #fff; padding: 8px; font-size: 12px; border-radius: 7px; border: none; font-weight: 800; cursor: pointer; } 
    .btn-action-print-chef { width: 100%; background: #2563eb; color: #fff; padding: 8px; font-size: 12px; border-radius: 7px; border: none; font-weight: 800; cursor: pointer; } 

    .custom-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; } 
    .custom-table th, .custom-table td { border: 1px solid rgba(255,255,255,0.1); padding: 9px 11px; } 
    .custom-table th { background: #0a1c38; color: #fbbf24; } 

    .modal-overlay { position: fixed !important; inset: 0 !important; background: rgba(3, 7, 18, 0.85) !important; backdrop-filter: blur(8px) !important; z-index: 999999 !important; display: none !important; align-items: center !important; justify-content: center !important; padding: 16px !important; } 
    .modal-overlay.active { display: flex !important; } 
    .modal-box { background: var(--card-bg) !important; border: 1.5px solid var(--chuspa-gold-border) !important; border-radius: 18px !important; max-width: 520px !important; width: 100% !important; max-height: 90vh !important; overflow-y: auto !important; padding: 24px !important; display: flex !important; flex-direction: column !important; gap: 12px !important; box-shadow: 0 20px 50px rgba(0,0,0,0.9); } 

    .alerta-centro-overlay { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.82); backdrop-filter: blur(6px); z-index: 1000000; display: none; align-items: center; justify-content: center; padding: 16px; } 
    .alerta-centro-overlay.active { display: flex; } 
    .alerta-centro-card { position: relative; width: 100%; max-width: 440px; background: #0d1e3a; border-radius: 20px; padding: 24px; overflow: hidden; box-shadow: 0 12px 45px rgba(0,0,0,0.9); border: 2px solid var(--chuspa-gold); text-align: center; } 
    .alerta-icono-wrap { width: 64px; height: 64px; border-radius: 50%; background: rgba(245, 158, 11, 0.15); border: 2px solid var(--chuspa-gold); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fbbf24; } 
    .btn-alerta-entendido { background: linear-gradient(135deg, #0056d2, #0284c7); color: #fff; font-weight: 900; font-size: 13.5px; border: none; border-radius: 12px; padding: 12px 24px; cursor: pointer; margin-top: 14px; width: 100%; } 
  </style> 
</head> 
<body> 

  <button type="button" class="btn-theme-toggle-floating" id="btnToggleTheme" onclick="alternarTemaVisual()" title="Cambiar Tema"></button>

  <!-- PANTALLA LOGIN --> 
  <div id="pantallaLogin"> 
    <div class="card-login"> 
      <div class="login-logos-header">
        <div class="login-chuspa-logo-wrap"><img src="CHUSPITA-circulo.png" alt="La Chuspa" onerror="this.src='https://lachuspaanuncios.com/wp-content/uploads/2023/10/cropped-logo-la-chuspa.png';"></div>
        <div class="login-brand-logo-wrap" id="loginBrandLogoWrap">🍽️</div>
      </div>
      <h3 id="loginTitlePreview">La Cusqueñita</h3> 
      <p class="sub">Plataforma Cloud de Gestión & TPV Comercial</p> 
      <form onsubmit="verificarLoginSistema(event)"> 
        <label>Usuario / Rol:</label> 
        <select id="loginUsuarioSelector"> 
          <option value="admin">Administrador (Gerencia)</option> 
          <option value="cajero">Cajero / Cobranzas</option> 
        </select> 
        <label>Nombre del Operador:</label> 
        <input type="text" id="loginUsuarioNombre" value="Administrador" required> 
        <label>Contraseña:</label> 
        <input type="password" id="loginPassword" placeholder="••••••••" required> 
        <button type="submit" class="btn btn-save" style="margin-top:16px; width:100%;">Entrar al Sistema</button> 
      </form> 
    </div> 
  </div> 

  <!-- DASHBOARD PRINCIPAL --> 
  <div id="panelAdminPrincipal" style="display: none;"> 
    <header class="top-admin-bar no-print" id="mainAdminHeaderBar"> 
      <button type="button" class="btn-toggle-global" onclick="toggleSidebarMenu()"><i class="fa-solid fa-bars"></i> Menú</button> 
      <div class="top-brand-center"> 
        <div style="font-weight:900; color:#f8fafc;" id="topBarTitle">La Cusqueñita</div> 
      </div> 
    </header> 

    <div class="admin-layout" id="adminLayoutWrapper"> 
      <aside class="sidebar no-print"> 
        <div class="brand-box"> 
          <div class="brand-left"> 
            <div class="brand-avatar" id="headerAvatar">🍽️</div> 
            <div> 
              <h2 id="headerBusinessName" style="font-size:15px; color:#f8fafc;">La Cusqueñita</h2> 
            </div> 
          </div> 
        </div> 
        <nav class="nav-menu"> 
          <button class="nav-item active" onclick="seleccionarOpcionNav('comandas')"><i class="fa-solid fa-bell-concierge"></i> Comandas en Vivo <span class="badge-live-orders" id="badgeTotalComandas">0</span></button> 
        </nav> 
      </aside> 

      <main class="main-view" id="mainArea"> 
        <section id="viewComandas"> 
          <div class="view-header"> 
            <h1>🛎️ Pantalla KDS: Control de Comandas</h1> 
            <button class="btn btn-add" onclick="cargarComandasEnVivo()">Actualizar</button> 
          </div> 
          <div class="tables-monitor-bar"><div class="tables-monitor-grid" id="tablesMonitorGrid"></div></div> 
          <div class="live-orders-grid" id="liveOrdersGrid"></div> 
        </section> 
      </main> 
    </div> 
  </div> 

  <!-- MODAL DE COBRO --> 
  <div class="modal-overlay" id="modalCobroMesa" onclick="cerrarModalCobro()"> 
    <div class="modal-box" onclick="event.stopPropagation()"> 
      <div style="display:flex; justify-content:space-between; align-items:center;"> 
        <h3 style="color:#fbbf24;" id="cobroTituloMesa">Cobro de Consumo</h3> 
        <button type="button" style="background:none; border:none; color:#ccc; font-size:24px; cursor:pointer;" onclick="cerrarModalCobro()">&times;</button> 
      </div> 

      <div style="background:#061122; padding:12px; border-radius:10px; border:1.5px solid var(--chuspa-gold-border);"> 
        <div style="display:flex; justify-content:space-between; font-size:13px;"><span>Mesa:</span> <b id="cobroClienteTxt">Mesa 01</b></div> 
        <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:900; color:#10b981; margin-top:6px;"><span>Total:</span> <span id="cobroTotalTxt">S/ 0.00</span></div> 
      </div> 

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"> 
        <div> 
          <label>Tipo Comprobante:</label> 
          <select id="cobroTipoComprobante" onchange="alternarCamposFactura(this.value)"> 
            <option value="Boleta">🧾 Boleta de Venta</option> 
            <option value="Factura">🏢 Factura Electrónica</option> 
          </select> 
        </div> 
        <div> 
          <label>Método de Pago:</label> 
          <select id="cobroMetodoPago"> 
            <option value="Efectivo">💵 Efectivo</option> 
            <option value="Yape">🟣 Yape</option> 
            <option value="Plin">🔵 Plin</option> 
            <option value="Tarjeta POS">💳 Tarjeta POS</option> 
          </select> 
        </div> 
      </div> 

      <!-- SECCIÓN BOLETA CON BÚSQUEDA DE DNI -->
      <div id="cajaDatosBoleta" style="background:#061122; padding:10px; border-radius:8px; border:1px dashed #334155;">
        <label style="margin-top:0;">DNI del Cliente:</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="cobroDniCliente" placeholder="Ingrese 8 dígitos" maxlength="8" style="margin-top:0; flex:1;">
          <button type="button" class="btn btn-save" style="padding:0 12px; font-size:12px;" onclick="buscarDniCajaAdmin()">Buscar</button>
        </div>
        <label>Nombre / Razón Social (RENIEC):</label>
        <input type="text" id="cobroNombreCliente" placeholder="Autocompletado automático..." style="background:#050e1c;">
      </div>

      <!-- SECCIÓN FACTURA CON BÚSQUEDA DE RUC -->
      <div id="cajaDatosFactura" style="display:none; background:#061122; padding:10px; border-radius:8px; border:1px dashed #334155;"> 
        <label style="margin-top:0;">RUC del Cliente:</label> 
        <div style="display:flex; gap:6px;">
          <input type="text" id="cobroRucCliente" placeholder="Ej. 20..." maxlength="11" style="margin-top:0; flex:1;">
          <button type="button" class="btn btn-save" style="padding:0 12px; font-size:12px;" onclick="buscarRucCajaAdmin()">Buscar RUC</button>
        </div>
        <label>Razón Social:</label> 
        <input type="text" id="cobroRazonCliente" placeholder="EMPRESA S.A.C." style="background:#050e1c;"> 
      </div> 

      <button type="button" class="btn btn-save" style="background:#10b981; width:100%; margin-top:10px;" onclick="confirmarCobroFinalizado()">Cobrar e Imprimir Comprobante</button> 
    </div> 
  </div> 

  <script> 
    const FIREBASE_DB_URL = "https://restaurante1-695f7-default-rtdb.firebaseio.com/"; 
    const canalPedidos = new BroadcastChannel('canal_inka_pedidos'); 
    let comandaCobrandoActual = null; 
    let todasLasComandasCache = []; 
    let listaMesasDinamicas = ["Mesa 01", "Mesa 02", "Mesa 03"];

    function alternarCamposFactura(tipo) { 
      const esFactura = (tipo === 'Factura');
      document.getElementById('cajaDatosFactura').style.display = esFactura ? 'block' : 'none'; 
      document.getElementById('cajaDatosBoleta').style.display = esFactura ? 'none' : 'block'; 
    } 

    async function abrirModalCobroComanda(idComanda) { 
      let comanda = todasLasComandasCache.find(c => c.id === idComanda); 
      if (!comanda) { 
        try { 
          const res = await fetch(`${FIREBASE_DB_URL}comandas/${idComanda}.json`); 
          if (res.ok) comanda = await res.json(); 
        } catch (e) {} 
      } 
      if (!comanda) return alert("Comanda no encontrada."); 
      comandaCobrandoActual = Object.assign({ id: idComanda }, comanda); 

      document.getElementById('cobroClienteTxt').innerText = `${comanda.cliente || comanda.mesa}`; 
      document.getElementById('cobroTotalTxt').innerText = `S/ ${(comanda.totalPEN || comanda.total || 0).toFixed(2)}`; 
      
      if (document.getElementById('cobroDniCliente')) document.getElementById('cobroDniCliente').value = comanda.dni || '';
      if (document.getElementById('cobroNombreCliente')) document.getElementById('cobroNombreCliente').value = comanda.cliente || '';

      document.getElementById('modalCobroMesa').classList.add('active'); 
    } 

    function cerrarModalCobro() { 
      document.getElementById('modalCobroMesa').classList.remove('active'); 
    } 

    /* BÚSQUEDA DE DNI Y RUC DESDE CAJA ADMIN */
    async function buscarDniCajaAdmin() {
      const dni = document.getElementById('cobroDniCliente').value.trim();
      if (dni.length !== 8) {
        alert("Ingrese un DNI válido de 8 dígitos.");
        return;
      }
      try {
        const res = await fetch(`../buscar_dni.php?dni=${dni}`);
        const data = await res.json();
        if (data.success && data.nombres_completos) {
          document.getElementById('cobroNombreCliente').value = data.nombres_completos;
        } else {
          alert(data.message || "No se encontraron datos para este DNI.");
        }
      } catch (e) {
        alert("Error al conectar con el servidor de búsqueda.");
      }
    }

    async function buscarRucCajaAdmin() {
      const ruc = document.getElementById('cobroRucCliente').value.trim();
      if (ruc.length !== 11) {
        alert("Ingrese un RUC válido de 11 dígitos.");
        return;
      }
      try {
        const res = await fetch(`../buscar_dni.php?ruc=${ruc}`);
        const data = await res.json();
        if (data.success && data.razon_social) {
          document.getElementById('cobroRazonCliente').value = data.razon_social;
        } else {
          alert(data.message || "No se encontraron datos para este RUC.");
        }
      } catch (e) {
        alert("Error al conectar con el servidor de búsqueda de RUC.");
      }
    }

    async function confirmarCobroFinalizado() { 
      if (!comandaCobrandoActual) return; 
      try {
        const total = parseFloat(comandaCobrandoActual.totalPEN || comandaCobrandoActual.total || 0); 
        const metodo = document.getElementById('cobroMetodoPago').value; 
        const tipoComp = document.getElementById('cobroTipoComprobante').value; 
        const docCliente = (tipoComp === 'Factura') ? document.getElementById('cobroRucCliente').value.trim() : document.getElementById('cobroDniCliente').value.trim();
        const razon = (tipoComp === 'Factura') ? document.getElementById('cobroRazonCliente').value.trim() : document.getElementById('cobroNombreCliente').value.trim();

        const venta = { 
          id: comandaCobrandoActual.id, 
          fecha: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }), 
          mesa: comandaCobrandoActual.mesa, 
          cliente: razon || 'CLIENTE VARIOS', 
          totalPEN: total, 
          pago: metodo, 
          tipoComprobante: tipoComp, 
          rucCliente: docCliente, 
          razonSocialCliente: razon || 'CLIENTE VARIOS' 
        }; 

        await fetch(`${FIREBASE_DB_URL}ventas/${comandaCobrandoActual.id}.json`, { 
          method: 'PUT', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify(venta) 
        });

        await fetch(`${FIREBASE_DB_URL}comandas/${comandaCobrandoActual.id}.json`, { 
          method: 'PATCH', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ estado: 'finalizado', agradecimientoFinal: true }) 
        });

        cerrarModalCobro(); 
        localStorage.setItem('factura_actual', JSON.stringify(venta));
        window.open('../factura.html', '_blank');
        alert("✔ Venta cobrada y finalizada."); 
      } catch (error) {
        alert("❌ Error al procesar el cobro.");
      }
    } 

    async function verificarLoginSistema(e) {
      e.preventDefault();
      sessionStorage.setItem("auth_rest", "true");
      document.getElementById('pantallaLogin').style.display = 'none';
      document.getElementById('panelAdminPrincipal').style.display = 'block';
    }

    window.onload = async () => { 
      if (sessionStorage.getItem("auth_rest") === "true") { 
        document.getElementById('pantallaLogin').style.display = 'none'; 
        document.getElementById('panelAdminPrincipal').style.display = 'block'; 
      } 
    }; 
  </script> 
</body> 
</html>
