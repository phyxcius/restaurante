<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reservas Oficiales | La Cusqueñita</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #c2410c;
      --accent: #f59e0b;
      --bg-warm: #18110e;
      --card-bg: #1e130f;
      --gold-badge: #fbbf24;
      --text-main: #fffdfa;
      --border-card: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-warm);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .box-reservas-page {
      background: var(--card-bg);
      border: 2px solid var(--border-card);
      border-radius: 26px;
      max-width: 430px;
      width: 100%;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      position: relative;
    }

    .header-reservas {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 12px;
    }
    .avatar-wrap {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--gold-badge);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .header-titles h2 { font-size: 19px; font-weight: 900; color: var(--gold-badge); }
    .header-titles span { font-size: 11.5px; color: #86efac; font-weight: bold; display: block; }

    .desc-txt { font-size: 12.5px; color: #ddd; line-height: 1.45; }

    /* ESTILO IDÉNTICO: CAMPOS TEXTBOX BLANCOS CON BORDES REDONDEADOS */
    .custom-input-white {
      width: 100%;
      background: #ffffff !important;
      color: #1c1917 !important;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .custom-input-white::placeholder { color: #6b7280; font-weight: 500; }
    .custom-input-white:focus { border-color: var(--accent); }

    .grid-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-submit-reserva {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(194, 65, 12, 0.45);
      margin-top: 4px;
    }
    .btn-submit-reserva:active { transform: scale(0.98); }

    .btn-compartir-whatsapp {
      background: #15803d;
      color: #fff;
      border: 1px solid #4ade80;
      padding: 11px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-compartir-whatsapp:active { transform: scale(0.98); }

    .social-links-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
    }
    .btn-social-icon {
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: 18px; text-decoration: none;
    }
    .btn-social-wa { background: #25d366; }
    .btn-social-fb { background: #1877f2; }
    .btn-social-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
    .btn-social-tk { background: #000; border: 1px solid #444; }

    .chuspa-tech-footer {
      background: rgba(254, 252, 232, 0.08);
      border: 1px dashed rgba(234, 179, 8, 0.45);
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      margin-top: 4px;
    }
    .chuspa-tech-left { display: flex; align-items: center; gap: 8px; }
    .chuspa-tech-img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #fff; }

    .btn-volver-carta {
      background: #374151; color: #f3f4f6; border: 1px solid #4b5563; padding: 11px 16px;
      border-radius: 20px; font-weight: 800; font-size: 13px; text-decoration: none; text-align: center;
      display: block;
    }
  </style>
</head>
<body>

  <div class="box-reservas-page">
    <div class="header-reservas">
      <div class="avatar-wrap" id="resLogoWrap">🍽️</div>
      <div class="header-titles">
        <h2 id="resTituloLocal">La Cusqueñita</h2>
        <span>Catálogo Oficial de Reservas & Eventos</span>
      </div>
    </div>

    <p class="desc-txt">
      Completa tus datos para agendar tu mesa familiar, grupo turístico o evento.
    </p>

    <form onsubmit="guardarReservaWeb(event)" style="display:flex; flex-direction:column; gap:9px;">
      <input type="text" id="resNombre" class="custom-input-white" placeholder="Nombre completo" required>
      <input type="tel" id="resWhatsApp" class="custom-input-white" placeholder="WhatsApp de contacto (+51...)" required>
      
      <div class="grid-duo">
        <input type="date" id="resFecha" class="custom-input-white" required>
        <input type="time" id="resHora" class="custom-input-white" required>
      </div>

      <div class="grid-duo">
        <input type="number" id="resPersonas" class="custom-input-white" placeholder="N° Personas" min="1" value="4" required>
        <select id="resMesaSelect" class="custom-input-white" style="cursor:pointer;"></select>
      </div>

      <textarea id="resNotas" class="custom-input-white" rows="2" placeholder="Notas (motivo, alergias, requerimientos)..."></textarea>

      <button type="submit" class="btn-submit-reserva" id="btnSubmitRes">
        <i class="fa-solid fa-calendar-check"></i> Confirmar y Agendar Reserva
      </button>

      <button type="button" class="btn-compartir-whatsapp" onclick="compartirPorWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> Compartir este link a mi WhatsApp para reservar después
      </button>
    </form>

    <!-- CONTACTO Y REDES SOCIALES -->
    <div style="text-align:center; border-top:1px dashed rgba(255,255,255,0.15); padding-top:10px; margin-top:4px;">
      <span style="font-size:12px; color:#fde047; font-weight:800; display:block;">
        <i class="fa-solid fa-phone"></i> Pedidos & Reservas: <span id="resTelefonoTxt">+51 969 773 064</span>
      </span>
      <div class="social-links-grid">
        <a href="https://wa.me/51969773064" target="_blank" class="btn-social-icon btn-social-wa" id="linkWa"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="#" target="_blank" class="btn-social-icon btn-social-fb" id="linkFb"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" target="_blank" class="btn-social-icon btn-social-ig" id="linkIg"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" target="_blank" class="btn-social-icon btn-social-tk" id="linkTk"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>

    <!-- SELLO LA CHUSPA TECH -->
    <a href="https://www.lachuspaanuncios.com/" target="_blank" class="chuspa-tech-footer">
      <div class="chuspa-tech-left">
        <img src="CHUSPITA-circulo.png" alt="La Chuspa" class="chuspa-tech-img" onerror="this.src='https://lachuspaanuncios.com/wp-content/uploads/2023/10/cropped-logo-la-chuspa.png'">
        <div>
          <div style="font-size:11px; font-weight:900; color:#fde047;">Tecnología La Chuspa Tech</div>
          <div style="font-size:9.5px; color:#fed7aa;">Digitalización de restaurantes en Cusco</div>
        </div>
      </div>
      <i class="fa-solid fa-arrow-up-right-from-square" style="color:#fde047; font-size:13px;"></i>
    </a>

    <a href="index.html" class="btn-volver-carta">
      <i class="fa-solid fa-utensils"></i> Volver a la Carta Digital
    </a>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://restaurante1-695f7-default-rtdb.firebaseio.com/";

    let CONFIG = {
      nombre: "La Cusqueñita",
      whatsapp: "51969773064",
      facebook: "",
      instagram: "",
      tiktok: ""
    };

    let listaMesas = [
      "Mesa 01", "Mesa 02", "Mesa 03", "Mesa 04", "Mesa 05",
      "Mesa 06", "Mesa 07", "Mesa 08", "Mesa 09", "Mesa 010",
      "Mesa 11", "Mesa 12", "Barra", "Terraza 1", "Terraza 2"
    ];

    async function cargarDatosReserva() {
      document.getElementById('resFecha').value = new Date().toISOString().split('T')[0];

      // 1. Cargar Identidad y Redes Sociales
      try {
        const res = await fetch(`${FIREBASE_DB_URL}config/identidad.json?_t=${Date.now()}`);
        if (res.ok) {
          const d = await res.json();
          if (d) {
            CONFIG = Object.assign(CONFIG, d);
            document.getElementById('resTituloLocal').innerText = CONFIG.nombre || "La Cusqueñita";
            const wa = CONFIG.whatsapp || "51969773064";
            document.getElementById('resTelefonoTxt').innerText = wa;

            const cleanWa = wa.replace(/\D/g, '');
            document.getElementById('linkWa').href = `https://wa.me/${cleanWa}`;
            if (CONFIG.facebook) document.getElementById('linkFb').href = CONFIG.facebook;
            if (CONFIG.instagram) document.getElementById('linkIg').href = CONFIG.instagram;
            if (CONFIG.tiktok) document.getElementById('linkTk').href = CONFIG.tiktok;

            const logoWrap = document.getElementById('resLogoWrap');
            if (CONFIG.logo && CONFIG.logo.startsWith('data:image')) {
              logoWrap.innerHTML = `<img src="${CONFIG.logo}" alt="Logo">`;
            } else {
              logoWrap.innerText = CONFIG.logo || "🍽️";
            }
          }
        }
      } catch (e) {}

      // 2. Cargar Mesas Dinámicas desde Firebase
      try {
        const resMesas = await fetch(`${FIREBASE_DB_URL}config/mesas.json?_t=${Date.now()}`);
        if (resMesas.ok) {
          const dMesas = await resMesas.json();
          if (Array.isArray(dMesas) && dMesas.length > 0) {
            listaMesas = dMesas;
          }
        }
      } catch (e) {}

      const sel = document.getElementById('resMesaSelect');
      sel.innerHTML = listaMesas.map(m => `<option value="${m}">${m}</option>`).join('');
    }

    function compartirPorWhatsApp() {
      const url = window.location.href;
      const msg = encodeURIComponent(`🍽️ ¡Hola! Te comparto el enlace oficial para agendar nuestra mesa o evento en *${CONFIG.nombre}*:\n${url}`);
      window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
    }

    async function guardarReservaWeb(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitRes');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registrando...';

      const id = "RES-" + Date.now();
      const data = {
        id: id,
        cliente: document.getElementById('resNombre').value.trim(),
        telefono: document.getElementById('resWhatsApp').value.trim(),
        fechaReserva: document.getElementById('resFecha').value,
        horaReserva: document.getElementById('resHora').value,
        personas: document.getElementById('resPersonas').value,
        mesaAsignada: document.getElementById('resMesaSelect').value,
        notas: document.getElementById('resNotas').value.trim() || 'Sin notas',
        fechaCreacion: new Date().toLocaleDateString()
      };

      try {
        await fetch(`${FIREBASE_DB_URL}reservas/${id}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        alert(`✔ ¡Reserva agendada exitosamente para ${data.cliente}! Nos comunicaremos al WhatsApp ${data.telefono} para confirmar.`);
        e.target.reset();
        document.getElementById('resFecha').value = new Date().toISOString().split('T')[0];
      } catch (err) {
        alert("Error al registrar reserva: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-calendar-check"></i> Confirmar y Agendar Reserva';
      }
    }

    window.addEventListener('DOMContentLoaded', cargarDatosReserva);
  </script>
</body>
</html>
