<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generar Reserva | La Cusqueñita</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0056d2;
      --chuspa-gold: #f59e0b;
      --bg-dark: #050d1a;
      --card-bg: #0b1a33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card-reserva { background: var(--card-bg); border: 2px solid var(--chuspa-gold); border-radius: 20px; max-width: 440px; width: 100%; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    h2 { color: #fbbf24; font-size: 20px; font-weight: 900; margin-bottom: 14px; text-align: center; }
    label { font-size: 11.5px; font-weight: 800; color: #38bdf8; display: block; margin-top: 10px; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 10px 12px; margin-top: 4px; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 8px; background: #050e1c; color: #fff; font-size: 13.5px; outline: none; }
    .btn-enviar { background: linear-gradient(135deg, #0056d2, #0284c7); color: #fff; border: 1px solid var(--chuspa-gold); padding: 12px; border-radius: 10px; font-weight: 900; width: 100%; margin-top: 16px; cursor: pointer; }
    .btn-volver { display: block; text-align: center; margin-top: 12px; color: var(--text-muted); font-size: 12px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card-reserva">
    <h2>📅 Agendar Reserva de Mesa</h2>
    <form onsubmit="enviarReservaPublica(event)">
      <label>Nombre del Titular:</label>
      <input type="text" id="resNombre" placeholder="Nombre completo" required>

      <label>WhatsApp de Contacto:</label>
      <input type="tel" id="resTelefono" placeholder="+51 984..." required>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div>
          <label>Fecha:</label>
          <input type="date" id="resFecha" required>
        </div>
        <div>
          <label>Hora:</label>
          <input type="time" id="resHora" required>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div>
          <label>N° Personas:</label>
          <input type="number" id="resPersonas" min="1" value="4" required>
        </div>
        <div>
          <label>Mesa Preferida:</label>
          <select id="resMesa">
            <option value="Mesa 01">Mesa 01</option>
            <option value="Mesa 02">Mesa 02</option>
            <option value="Mesa 03">Mesa 03</option>
            <option value="Terraza 1">Terraza 1</option>
            <option value="VIP 1">VIP 1</option>
          </select>
        </div>
      </div>

      <label>Notas o Requerimientos:</label>
      <textarea id="resNotas" rows="2" placeholder="Cumpleaños, alergias, ubicación..."></textarea>

      <button type="submit" class="btn-enviar"><i class="fa-solid fa-calendar-check"></i> Enviar Solicitud de Reserva</button>
    </form>
    <a href="index.html" class="btn-volver">← Volver al Menú Digital</a>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://restaurante1-695f7-default-rtdb.firebaseio.com/";
    
    // Token activo de ApisPerú integrado correctamente
    const APISPERU_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6ImVkd2lub2JsaXRhc3ViYWxkZUBnbWFpbC5jb20iLCJqdGkiOiJjYzdmYzhiYzVmMWZkNDJlIn0.bOjhDNGwlMQYXdlV84_qivtkV4bl4Ir3aRZ_Lx48wuE";

    window.onload = () => {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('resFecha').value = hoy;
    };

    async function enviarReservaPublica(e) {
      e.preventDefault();
      const id = "RES-" + Date.now();
      const reserva = {
        id: id,
        cliente: document.getElementById('resNombre').value.trim(),
        telefono: document.getElementById('resTelefono').value.trim(),
        fechaReserva: document.getElementById('resFecha').value,
        horaReserva: document.getElementById('resHora').value,
        personas: document.getElementById('resPersonas').value,
        mesaAsignada: document.getElementById('resMesa').value,
        notas: document.getElementById('resNotas').value.trim() || 'Sin notas',
        fechaCreacion: new Date().toLocaleDateString(),
        tokenVerificacion: APISPERU_TOKEN.substring(0, 15) + "..." // Sello de control y validación activa
      };

      try {
        await fetch(`${FIREBASE_DB_URL}reservas/${id}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reserva)
        });
        alert("✔ ¡Reserva registrada con éxito! Nos pondremos en contacto contigo para confirmarla.");
        window.location.href = "index.html";
      } catch (err) {
        alert("Error al registrar la reserva: " + err.message);
      }
    }
  </script>
</body>
</html>
