<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas Prepago | La Cusqueñita</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #c2410c;
      --accent: #f59e0b;
      --bg-dark: #18110e;
      --card-bg: #261a15;
      --gold: #fde047;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg-dark); color: #fff; padding: 20px 14px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card-reserva {
      background: var(--card-bg); border: 1.5px solid var(--accent);
      border-radius: 20px; max-width: 460px; width: 100%; padding: 26px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .header-box { text-align: center; margin-bottom: 18px; border-bottom: 1px dashed rgba(255,255,255,0.12); padding-bottom: 12px; }
    h2 { color: var(--gold); font-size: 21px; font-weight: 900; }
    p.sub { font-size: 12px; color: #aaa; margin-top: 3px; }

    label { font-size: 11.5px; font-weight: 800; color: var(--gold); display: block; margin-top: 10px; text-transform: uppercase; }
    input, select {
      width: 100%; padding: 10px 12px; margin-top: 4px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2); background: #160e0b; color: #fff; font-size: 13.5px; outline: none;
    }
    .grid-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-reservar {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; border: none; padding: 14px; border-radius: 22px;
      font-size: 14px; font-weight: 900; width: 100%; margin-top: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* MENSAJE DE BLOQUEO Y REDIRECCIÓN */
    .banner-bloqueado {
      display: none; background: #3b1712; border: 1.5px solid #dc2626; border-radius: 12px;
      padding: 16px; text-align: center; margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="card-reserva">
    <div class="header-box">
      <div style="font-size:38px;">🍽️</div>
      <h2 id="lblNombreLocal">La Cusqueñita</h2>
      <p class="sub">Catálogo de Reservas Prepago & Eventos</p>
    </div>

    <!-- BANNER SI ESTÁN BLOQUEADAS -->
    <div class="banner-bloqueado" id="bannerBloqueoWeb">
      <h3 style="color:#fca5a5; font-size:15px; margin-bottom:4px;">⚠️ Reservas Online Pausadas</h3>
      <p style="font-size:12px; color:#ddd; margin-bottom:12px;">Por favor visita nuestro portal oficial o contáctanos directamente.</p>
      <a href="https://www.lachuspaanuncios.com/" id="linkWebOficial" style="background:#dc2626; color:#fff; text-decoration:none; padding:8px 14px; border-radius:8px; font-weight:bold; font-size:12px; display:inline-block;">
        Ir a la Página Web Oficial
      </a>
    </div>

    <form id="formReservaPrincipal" onsubmit="procesarReservaEnNube(event)">
      <label>Tipo de Evento:</label>
      <select id="resTipo" required>
        <option value="Cena Navideña / Fin de Año">🎄 Cena Navideña / Fin de Año</option>
        <option value="Grupo Familiar (4 a 12 personas)">👨‍👩‍👧‍👦 Grupo Familiar (4 a 12 personas)</option>
        <option value="Parejas (Cena Romántica)">❤️ Parejas (Cena Romántica)</option>
        <option value="Evento Corporativo / Empresa">🏢 Evento Corporativo / Empresa</option>
      </select>

      <label>Titular de la Reserva:</label>
      <input type="text" id="resNombre" placeholder="Tu nombre completo" required>

      <label>Teléfono WhatsApp:</label>
      <input type="tel" id="resTelefono" placeholder="984123456" required>

      <div class="grid-dos">
        <div>
          <label>Fecha:</label>
          <input type="date" id="resFecha" required>
        </div>
        <div>
          <label>Hora:</label>
          <input type="time" id="resHora" required>
        </div>
      </div>

      <div class="grid-dos">
        <div>
          <label>N° Personas:</label>
          <input type="number" id="resPersonas" min="1" max="50" value="4" required>
        </div>
        <div>
          <label>Preferencia:</label>
          <select id="resMesaPreferencia">
            <option value="Salón Principal">Salón Principal</option>
            <option value="Terraza 1">Terraza 1</option>
            <option value="Terraza 2">Terraza 2</option>
          </select>
        </div>
      </div>

      <label>Notas especiales:</label>
      <input type="text" id="resNotas" placeholder="Requerimientos, alergias, etc.">

      <button type="submit" class="btn-reservar" id="btnEnviarReserva">
        <i class="fa-brands fa-whatsapp"></i> <span>Solicitar Reserva y Abono</span>
      </button>
    </form>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://restaurante1-695f7-default-rtdb.firebaseio.com/";

    let configNegocio = {
      nombre: "La Cusqueñita",
      whatsapp: "51969773064",
      estadoReservas: "habilitadas",
      urlWebRedireccion: "https://www.lachuspaanuncios.com/"
    };

    async function verificarEstadoYSistema() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}config/identidad.json?_t=${Date.now()}`);
        if (res.ok) {
          const conf = await res.json();
          if (conf) {
            configNegocio = Object.assign(configNegocio, conf);
            document.getElementById('lblNombreLocal').innerText = configNegocio.nombre;

            // Si el administrador bloqueó las reservas en el panel, redirigir
            if (configNegocio.estadoReservas === 'bloqueadas') {
              document.getElementById('formReservaPrincipal').style.display = 'none';
              document.getElementById('bannerBloqueoWeb').style.display = 'block';
              document.getElementById('linkWebOficial').href = configNegocio.urlWebRedireccion || "https://www.lachuspaanuncios.com/";
              // Redirección suave automática tras 3 segundos
              setTimeout(() => {
                window.location.href = configNegocio.urlWebRedireccion || "https://www.lachuspaanuncios.com/";
              }, 3000);
            }
          }
        }
      } catch (e) {}

      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('resFecha').min = hoy;
      document.getElementById('resFecha').value = hoy;
    }

    async function procesarReservaEnNube(e) {
      e.preventDefault();

      const btn = document.getElementById('btnEnviarReserva');
      btn.disabled = true;
      btn.innerText = "Guardando solicitud...";

      const reservaId = "RES-" + Date.now();
      const tipo = document.getElementById('resTipo').value;
      const nombre = document.getElementById('resNombre').value.trim();
      const telefono = document.getElementById('resTelefono').value.trim();
      const fecha = document.getElementById('resFecha').value;
      const hora = document.getElementById('resHora').value;
      const personas = document.getElementById('resPersonas').value;
      const mesa = document.getElementById('resMesaPreferencia').value;
      const notas = document.getElementById('resNotas').value.trim();

      const objetoReserva = {
        id: reservaId,
        fechaCreacion: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }),
        tipo: tipo,
        cliente: nombre,
        telefono: telefono,
        fechaReserva: fecha,
        horaReserva: hora,
        personas: personas,
        preferenciaMesa: mesa,
        notas: notas || "Ninguna",
        estado: "pendiente_abono"
      };

      // Guardar en Firebase para que el administrador la vea en el panel
      try {
        await fetch(`${FIREBASE_DB_URL}reservas/${reservaId}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(objetoReserva)
        });
      } catch (err) {}

      // Redirigir a WhatsApp
      const numeroWsp = configNegocio.whatsapp || "51969773064";
      const textoWhatsApp = 
        `¡Hola *${configNegocio.nombre}*! 👋%0A` +
        `Deseo solicitar la reserva para *${tipo}*:%0A%0A` +
        `📌 *ID Reserva:* ${reservaId}%0A` +
        `👤 *Titular:* ${nombre}%0A` +
        `📅 *Fecha:* ${fecha}%0A` +
        `⏰ *Hora:* ${hora}%0A` +
        `👥 *Personas:* ${personas}%0A` +
        (notas ? `📝 *Notas:* ${notas}%0A%0A` : `%0A`) +
        `¿Podrían confirmarme las cuentas de Yape/Plin para el abono de reserva? Gracias.`;

      window.location.href = `https://wa.me/${numeroWsp}?text=${textoWhatsApp}`;
    }

    window.addEventListener('DOMContentLoaded', verificarEstadoYSistema);
  </script>
</body>
</html>
