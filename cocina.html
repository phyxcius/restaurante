<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pantalla KDS Cocina | La Cusqueñita</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-kds: #0b0705;
      --card-bg: #1c130e;
      --card-border: rgba(245, 158, 11, 0.35);
      --gold: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.65);
      --orange: #ea580c;
      --blue: #0284c7;
      --green: #16a34a;
      --red: #ef4444;
      --text: #fffdfa;
      --muted: #a8a29e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body { background-color: var(--bg-kds); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* BARRA SUPERIOR PRINCIPAL */
    .kds-header {
      background: #180e0a;
      border-bottom: 2.5px solid var(--orange);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .kds-brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* AVATAR CHEF INNOVACIÓN */
    .chef-avatar-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), var(--gold));
      border: 2px solid var(--gold);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 0 14px var(--gold-glow);
      flex-shrink: 0;
    }
    .chef-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .kds-title-text h1 {
      font-size: 19px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .kds-title-text span {
      font-size: 11px;
      color: #ddd;
      font-weight: 700;
    }

    /* RELOJ DIGITAL EN VIVO */
    .kds-live-clock {
      background: #110805;
      border: 1.5px solid rgba(251, 191, 36, 0.4);
      padding: 6px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
      font-size: 19px;
      font-weight: 900;
      color: #fde047;
      letter-spacing: 1px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }

    .kds-header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge-metric {
      background: #24140e;
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 800;
    }
    .badge-metric b { font-size: 16px; margin-left: 4px; }

    .btn-top-action {
      background: #261611;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-top-action:active { transform: scale(0.96); }

    /* BARRA DE FILTROS & CALENDARIO */
    .kds-control-bar {
      background: #140b07;
      border-bottom: 1px solid var(--card-border);
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .kds-date-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kds-date-input {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--gold);
      background: #090403;
      color: #fde047;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    .btn-quick-date {
      background: #24140e;
      border: 1px solid rgba(255,255,255,0.15);
      color: #ddd;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-quick-date.active {
      background: var(--orange);
      border-color: var(--gold);
      color: #fff;
    }

    .kds-state-filters {
      display: flex;
      gap: 6px;
    }
    .btn-state-filter {
      background: #1f120c;
      border: 1px solid rgba(255,255,255,0.15);
      color: #bbb;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-state-filter.active {
      background: var(--blue);
      color: #fff;
      border-color: #38bdf8;
    }

    /* REJILLA DE COMANDAS */
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      padding: 18px;
      flex: 1;
      align-content: start;
    }

    /* TARJETA DE COMANDA TAMAÑO GRANDE */
    .kds-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2.5px solid var(--card-border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 25px rgba(0,0,0,0.7);
      overflow: hidden;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    /* RESPLANDOR Y BRILLO INTENSO PARA NUEVAS COMANDAS */
    .kds-card.glow-pulso {
      border-color: #f59e0b !important;
      animation: resplandorBrillante 1.8s infinite alternate ease-in-out;
    }
    @keyframes resplandorBrillante {
      0% {
        box-shadow: 0 0 14px rgba(245, 158, 11, 0.4), inset 0 0 10px rgba(245, 158, 11, 0.2);
        border-color: #f59e0b;
      }
      100% {
        box-shadow: 0 0 35px rgba(245, 158, 11, 0.95), inset 0 0 20px rgba(245, 158, 11, 0.5);
        border-color: #fde047;
      }
    }

    /* ESTADOS */
    .kds-card.estado-iniciado .card-top { background: #78350f; color: #fde047; }
    .kds-card.estado-cocina { border-color: #0284c7 !important; }
    .kds-card.estado-cocina .card-top { background: #0369a1; color: #fff; }
    .kds-card.estado-servido { border-color: #15803d !important; opacity: 0.88; }
    .kds-card.estado-servido .card-top { background: #166534; color: #bbf7d0; }
    .kds-card.estado-finalizado { border-color: #444 !important; opacity: 0.72; }
    .kds-card.estado-finalizado .card-top { background: #262626; color: #aaa; }

    /* ENCABEZADO DE TARJETA */
    .card-top {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
    }
    .card-mesa-title {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-order-seq {
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* BARRA DE HORA Y TIEMPO */
    .card-timer-bar {
      background: rgba(0,0,0,0.45);
      padding: 6px 16px;
      font-size: 13px;
      color: #bbb;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255,255,255,0.12);
    }
    .timer-alert { color: #f87171 !important; font-weight: 900; }

    /* LISTA DE PLATOS GRANDES */
    .card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .plato-item-row {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.35;
      color: #fff;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 6px;
    }
    .plato-qty-badge {
      background: #7c2d12;
      color: #fde047;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 16px;
      border: 1px solid var(--orange);
      flex-shrink: 0;
    }

    .card-notas-box {
      background: rgba(239, 68, 68, 0.18);
      border-left: 4px solid var(--red);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 800;
      margin-top: 4px;
    }

    /* BOTONERA TÁCTIL DE ACCIÓN */
    .card-actions {
      padding: 12px 14px;
      background: rgba(0,0,0,0.35);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 8px;
    }
    .btn-action-kds {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn-action-kds:active { transform: scale(0.97); }
    .btn-kds-cook { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; }
    .btn-kds-ready { background: linear-gradient(135deg, #16a34a, #22c55e); color: #fff; }
    .btn-kds-print { background: #374151; color: #e5e7eb; border: 1px solid #4b5563; flex: 0.55; }

    /* MODAL DE CONTABILIDAD Y RESUMEN POR CATEGORÍAS */
    .kds-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      z-index: 99999; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .kds-modal-overlay.active { display: flex; }
    .kds-modal-box {
      background: #1c130e; border: 2px solid var(--gold); border-radius: 20px;
      max-width: 580px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px;
      display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 45px rgba(0,0,0,0.9);
    }
    .kds-table-stats {
      width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;
    }
    .kds-table-stats th, .kds-table-stats td {
      padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .kds-table-stats th { color: var(--gold); text-transform: uppercase; font-size: 11.5px; }

    .kds-empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #666;
    }
    .kds-empty-msg i { font-size: 58px; margin-bottom: 14px; color: #444; }
  </style>
</head>
<body>

  <!-- CABECERA SUPERIOR KDS -->
  <header class="kds-header">
    <div class="kds-brand-block">
      <div class="chef-avatar-wrap" title="Jefe de Cocina">
        <i class="fa-solid fa-user-ninja"></i>
      </div>
      <div class="kds-title-text">
        <h1 id="kdsNombreLocal">LA CUSQUEÑITA</h1>
        <span>SISTEMA KDS COCINA • SIN PAPEL</span>
      </div>
    </div>

    <!-- RELOJ DIGITAL EN VIVO -->
    <div class="kds-live-clock" id="kdsClockDisplay">
      <i class="fa-regular fa-clock" style="font-size:15px; color:var(--orange);"></i>
      <span id="relojHoraActual">--:--:--</span>
    </div>

    <div class="kds-header-actions">
      <div class="badge-metric">Por Preparar: <b id="cntPendientes" style="color:var(--gold);">0</b></div>
      <div class="badge-metric">En Fuego: <b id="cntEnCocina" style="color:#38bdf8;">0</b></div>
      <div class="badge-metric">Servidos: <b id="cntServidos" style="color:#86efac;">0</b></div>

      <button type="button" class="btn-top-action" onclick="abrirModalContabilidad()">
        <i class="fa-solid fa-chart-pie"></i> Contabilidad Platos
      </button>

      <button type="button" class="btn-top-action" onclick="probarSonidoCampana()">
        <i class="fa-solid fa-bell"></i> Probar Campana
      </button>
    </div>
  </header>

  <!-- BARRA DE FECHAS & FILTROS DE ESTADO -->
  <div class="kds-control-bar">
    <div class="kds-date-selector">
      <span style="font-size:12px; font-weight:800; color:var(--gold);"><i class="fa-solid fa-calendar-day"></i> Fecha:</span>
      <input type="date" id="kdsFechaFiltro" class="kds-date-input" onchange="cambiarFechaKDS(this.value)">
      <button type="button" class="btn-quick-date active" id="btnFiltroTodasFechas" onclick="setFiltroFechaRapida('todas')">Todas</button>
      <button type="button" class="btn-quick-date" id="btnFiltroHoy" onclick="setFiltroFechaRapida('hoy')">Hoy</button>
      <button type="button" class="btn-quick-date" id="btnFiltroAyer" onclick="setFiltroFechaRapida('ayer')">Ayer</button>
    </div>

    <div class="kds-state-filters">
      <button type="button" class="btn-state-filter active" id="btnEstadoActivas" onclick="setFiltroEstado('activas')">🔥 Solo Activas (En Cocina)</button>
      <button type="button" class="btn-state-filter" id="btnEstadoTodas" onclick="setFiltroEstado('todas')">📋 Todas las Comandas</button>
      <button type="button" class="btn-state-filter" id="btnEstadoServidas" onclick="setFiltroEstado('servidas')">✅ Ya Servidas</button>
    </div>
  </div>

  <!-- MATRIZ DE COMANDAS EN ORDEN DE LLEGADA -->
  <main class="kds-grid" id="kdsGridOrders">
    <div class="kds-empty-msg">
      <i class="fa-solid fa-utensils"></i>
      <h2>Cocina en Espera</h2>
      <p>Esperando órdenes entrantes del salón...</p>
    </div>
  </main>

  <!-- MODAL: CONTABILIDAD Y RESUMEN POR CATEGORÍAS -->
  <div class="kds-modal-overlay" id="modalContabilidadKDS" onclick="cerrarModalContabilidad()">
    <div class="kds-modal-box" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid rgba(255,255,255,0.1); padding-bottom:8px;">
        <h3 style="color:var(--gold); font-size:17px; font-weight:900;"><i class="fa-solid fa-calculator"></i> Conteo y Contabilidad de Platos</h3>
        <button type="button" style="background:none; border:none; color:#ccc; font-size:24px; font-weight:bold; cursor:pointer;" onclick="cerrarModalContabilidad()">&times;</button>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:800; background:#110805; padding:10px; border-radius:10px;">
        <span>Total de Platos Marchados: <b style="color:#fde047;" id="statTotalPorciones">0</b></span>
        <span>Comandas Procesadas: <b style="color:#86efac;" id="statTotalComandas">0</b></span>
      </div>

      <div style="max-height:55vh; overflow-y:auto;">
        <table class="kds-table-stats">
          <thead>
            <tr>
              <th>Plato / Detalle</th>
              <th style="text-align:right;">Cantidad</th>
            </tr>
          </thead>
          <tbody id="tablaConteoPlatosBody">
            <tr><td colspan="2" style="text-align:center; color:#888;">Cargando platos...</td></tr>
          </tbody>
        </table>
      </div>

      <button type="button" class="btn-action-kds btn-kds-cook" onclick="cerrarModalContabilidad()">
        Entendido / Volver al Tablero
      </button>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://restaurante1-695f7-default-rtdb.firebaseio.com/";
    const canalPedidos = new BroadcastChannel('canal_inka_pedidos');

    let audioCtx = null;
    let comandasCache = [];
    let estadosConocidosKDS = {};
    let fechaFiltroSeleccionada = "";
    let filtroEstadoActual = "activas";

    /* 1. RELOJ DIGITAL EN VIVO */
    function actualizarRelojEnVivo() {
      const ahora = new Date();
      const horas = String(ahora.getHours()).padStart(2, '0');
      const minutos = String(ahora.getMinutes()).padStart(2, '0');
      const segundos = String(ahora.getSeconds()).padStart(2, '0');
      const relojEl = document.getElementById('relojHoraActual');
      if (relojEl) relojEl.innerText = `${horas}:${minutos}:${segundos}`;
    }
    setInterval(actualizarRelojEnVivo, 1000);
    actualizarRelojEnVivo();

    /* 2. AUDIO DE CAMPANA DE COCINA */
    function asegurarAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }
    window.addEventListener('click', asegurarAudio, { once: true });
    window.addEventListener('touchstart', asegurarAudio, { once: true });

    function sonarCampanaCocina() {
      try {
        asegurarAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(1760, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.85);

        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.95);
      } catch (e) {}
    }
    function probarSonidoCampana() { sonarCampanaCocina(); }

    /* 3. ESCUCHA BIDIRECCIONAL DESDE CARTA O PANEL */
    canalPedidos.onmessage = (event) => {
      cargarComandasCocina();
    };

    /* 4. CARGA PRINCIPAL DE COMANDAS */
    async function cargarComandasCocina() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}comandas.json?_t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') {
            const lista = Object.keys(data).map(k => {
              const item = data[k];
              if (!item || typeof item !== 'object') return null;
              return Object.assign({ id: k }, item);
            }).filter(Boolean);

            // DETECCIÓN DE NUEVAS COMANDAS PARA EFECTO BRILLANTE Y CAMPANA
            lista.forEach(c => {
              const estado = String(c.estado || '').toLowerCase();
              if (!estadosConocidosKDS[c.id]) {
                if (Object.keys(estadosConocidosKDS).length > 0 && estado !== 'finalizado') {
                  sonarCampanaCocina();
                }
              }
              estadosConocidosKDS[c.id] = estado;
            });

            comandasCache = lista;
            renderizarTarjetasKDS();
            return;
          }
        }
      } catch (e) {
        console.error("Error al cargar comandas KDS:", e);
      }

      comandasCache = [];
      renderizarTarjetasKDS();
    }

    /* 5. RENDERIZAR COMANDAS EN ORDEN SECUENCIAL DE LLEGADA */
    function renderizarTarjetasKDS() {
      const grid = document.getElementById('kdsGridOrders');
      if (!grid) return;

      // Conteo de métricas generales de cocina
      let countPendientes = 0;
      let countCocina = 0;
      let countServidos = 0;

      comandasCache.forEach(c => {
        const est = String(c.estado || 'iniciado').toLowerCase();
        if (est === 'iniciado' || est === 'por_confirmar') countPendientes++;
        else if (est === 'cocina') countCocina++;
        else if (est === 'servido' || est === 'finalizado') countServidos++;
      });

      document.getElementById('cntPendientes').innerText = countPendientes;
      document.getElementById('cntEnCocina').innerText = countCocina;
      document.getElementById('cntServidos').innerText = countServidos;

      // FILTRADO POR FECHA
      let comandasFiltradas = comandasCache.filter(c => {
        if (!fechaFiltroSeleccionada) return true;
        const fec = String(c.fecha || "");
        const partes = fechaFiltroSeleccionada.split('-');
        let diaFiltro = "";
        if (partes.length === 3) diaFiltro = `${parseInt(partes[2])}/${parseInt(partes[1])}/${partes[0]}`;
        return fec.includes(diaFiltro) || fec.includes(fechaFiltroSeleccionada);
      });

      // FILTRADO POR ESTADO
      comandasFiltradas = comandasFiltradas.filter(c => {
        const est = String(c.estado || 'iniciado').toLowerCase();
        if (filtroEstadoActual === 'activas') {
          return est === 'iniciado' || est === 'por_confirmar' || est === 'cocina';
        } else if (filtroEstadoActual === 'servidas') {
          return est === 'servido' || est === 'finalizado';
        }
        return true; // 'todas' no se eliminan y permanecen visibles
      });

      // ORDEN ESTRICTO DE LLEGADA: El primero que pidió va primero
      comandasFiltradas.sort((a, b) => (a.timestampOrden || 0) - (b.timestampOrden || 0));

      if (comandasFiltradas.length === 0) {
        grid.innerHTML = `
          <div class="kds-empty-msg">
            <i class="fa-solid fa-utensils"></i>
            <h2>Cocina al Día</h2>
            <p>No hay comandas pendientes para este filtro.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = comandasFiltradas.map((c, index) => {
        let estado = String(c.estado || 'iniciado').toLowerCase();
        if (estado === 'por_confirmar') estado = 'iniciado';

        // EFECTO DE BRILLO PULSANTE EN COMANDAS PENDIENTES
        const claseBrillo = (estado === 'iniciado') ? 'glow-pulso' : '';

        // Calcular minutos transcurridos
        const minutos = c.timestampOrden ? Math.floor((Date.now() - c.timestampOrden) / 60000) : 0;
        const alertaTiempo = (minutos >= 15 && estado !== 'servido' && estado !== 'finalizado') ? 'timer-alert' : '';

        // Desglosar platos con cantidades grandes
        const platosArray = (c.productos || '').split(', ').filter(Boolean);

        const numTurno = c.numeroTurno || (index + 1);

        let badgeEstadoTexto = "🟡 1. PENDIENTE";
        if (estado === 'cocina') badgeEstadoTexto = "🔵 2. EN FUEGO";
        else if (estado === 'servido') badgeEstadoTexto = "🟢 3. SERVIDO";
        else if (estado === 'finalizado') badgeEstadoTexto = "🏁 COBRADO";

        return `
          <div class="kds-card estado-${estado} ${claseBrillo}">
            <div class="card-top">
              <span class="card-mesa-title">
                <b>${c.mesa || 'Mesa'}</b>
                <span style="font-size:13px; opacity:0.85;">(${c.cliente ? c.cliente.split('(')[1]?.replace(')', '') || c.cliente : 'Comensal'})</span>
              </span>
              <span class="card-order-seq">Orden #${numTurno < 10 ? '0' + numTurno : numTurno}</span>
            </div>

            <div class="card-timer-bar">
              <span>${badgeEstadoTexto} • ${c.fecha ? c.fecha.split(' ')[1] || '' : ''}</span>
              <span class="${alertaTiempo}"><b>${estado === 'servido' || estado === 'finalizado' ? 'Despachado' : 'Hace ' + minutos + ' min'}</b></span>
            </div>

            <div class="card-body">
              ${platosArray.map(p => {
                const partes = p.match(/^(\d+)x\s*(.*)$/);
                const cant = partes ? partes[1] : "1";
                const nombrePlato = partes ? partes[2] : p;
                return `
                  <div class="plato-item-row">
                    <span class="plato-qty-badge">${cant}x</span>
                    <span>${nombrePlato}</span>
                  </div>
                `;
              }).join('')}

              ${c.notas && c.notas !== 'Sin notas' ? `
                <div class="card-notas-box">
                  <i class="fa-solid fa-triangle-exclamation"></i> <b>Nota del Comensal:</b> ${c.notas}
                </div>
              ` : ''}
            </div>

            <div class="card-actions">
              ${estado === 'iniciado' ? `
                <button type="button" class="btn-action-kds btn-kds-cook" onclick="cambiarEstadoKDS('${c.id}', 'cocina')">
                  <i class="fa-solid fa-fire"></i> Preparar
                </button>
              ` : ''}

              ${estado === 'cocina' ? `
                <button type="button" class="btn-action-kds btn-kds-ready" onclick="cambiarEstadoKDS('${c.id}', 'servido')">
                  <i class="fa-solid fa-check-double"></i> Listo / Servido
                </button>
              ` : ''}

              ${estado === 'servido' ? `
                <button type="button" class="btn-action-kds" style="background:#27272a; color:#86efac; cursor:default;">
                  <i class="fa-solid fa-circle-check"></i> Ya en Mesa
                </button>
              ` : ''}

              <!-- BOTÓN IMPRIMIR COMANDA INDIVIDUAL -->
              <button type="button" class="btn-action-kds btn-kds-print" onclick="imprimirComandaIndividual('${c.id}')" title="Imprimir Ticket Cocina">
                <i class="fa-solid fa-print"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    /* 6. CAMBIO DE ESTADO TÁCTIL SINCRONIZADO */
    async function cambiarEstadoKDS(id, nuevoEstado) {
      try {
        await fetch(`${FIREBASE_DB_URL}comandas/${id}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            estado: nuevoEstado,
            clientePidiendoCuenta: false
          })
        });

        // Notificación en tiempo real al panel de administración y al comensal
        canalPedidos.postMessage({
          tipo: 'ESTADO_ACTUALIZADO',
          id: id,
          estado: nuevoEstado
        });

        cargarComandasCocina();
      } catch (e) {
        alert("Error al actualizar estado en cocina.");
      }
    }

    /* 7. IMPRIMIR TICKET INDIVIDUAL DE COMANDA */
    function imprimirComandaIndividual(idComanda) {
      const c = comandasCache.find(x => x.id === idComanda);
      if (!c) return alert("Comanda no disponible.");

      const platosArray = (c.productos || '').split(', ').filter(Boolean);
      const ventana = window.open('', '_blank');
      ventana.document.write(`
        <!DOCTYPE html><html><head><title>TICKET COCINA - ${c.mesa}</title>
        <style>
          body { font-family: monospace; width: 72mm; margin: 0 auto; padding: 12px 6px; font-size: 14px; text-align: center; }
          h2, h3 { margin: 4px 0; }
          hr { border: 1px dashed #000; margin: 8px 0; }
          .left { text-align: left; }
          .item { font-size: 16px; font-weight: bold; margin: 6px 0; }
          .notas { background: #eee; padding: 6px; font-size: 12px; font-style: italic; }
        </style></head><body>
          <h2>*** ORDEN DE COCINA ***</h2>
          <h3>${(c.mesa || 'MESA').toUpperCase()}</h3>
          <p>${c.fecha || new Date().toLocaleString()} • Turno #${c.numeroTurno || '01'}</p>
          <hr>
          <div class="left">
            ${platosArray.map(p => `<div class="item">👉 ${p}</div>`).join('')}
          </div>
          ${c.notas && c.notas !== 'Sin notas' ? `<div class="notas left"><b>Nota:</b> ${c.notas}</div>` : ''}
          <hr>
          <p style="font-size:11px;">Prioridad por orden de llegada</p>
          <script>window.onload = function(){ window.print(); window.close(); }<\/script>
        </body></html>
      `);
      ventana.document.close();
    }

    /* 8. CONTABILIDAD DE PLATOS Y TOTALES */
    function abrirModalContabilidad() {
      const modal = document.getElementById('modalContabilidadKDS');
      const tbody = document.getElementById('tablaConteoPlatosBody');
      const statPorciones = document.getElementById('statTotalPorciones');
      const statComandas = document.getElementById('statTotalComandas');

      let conteoPlatos = {};
      let totalPorciones = 0;

      comandasCache.forEach(c => {
        const platosArray = (c.productos || '').split(', ').filter(Boolean);
        platosArray.forEach(p => {
          const partes = p.match(/^(\d+)x\s*(.*)$/);
          const cant = partes ? parseInt(partes[1]) : 1;
          const nombre = partes ? partes[2].trim() : p.trim();

          conteoPlatos[nombre] = (conteoPlatos[nombre] || 0) + cant;
          totalPorciones += cant;
        });
      });

      statPorciones.innerText = totalPorciones;
      statComandas.innerText = comandasCache.length;

      const nombresOrdenados = Object.keys(conteoPlatos).sort((a, b) => conteoPlatos[b] - conteoPlatos[a]);

      if (nombresOrdenados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#888;">No hay platos registrados aún.</td></tr>';
      } else {
        tbody.innerHTML = nombresOrdenados.map(nombre => `
          <tr>
            <td><b style="color:#fff;">${nombre}</b></td>
            <td style="text-align:right; font-weight:900; color:var(--gold); font-size:16px;">${conteoPlatos[nombre]} u.</td>
          </tr>
        `).join('');
      }

      modal.classList.add('active');
    }

    function cerrarModalContabilidad() {
      document.getElementById('modalContabilidadKDS').classList.remove('active');
    }

    /* 9. MANEJO DE FILTROS DE FECHAS Y ESTADOS */
    function cambiarFechaKDS(val) {
      fechaFiltroSeleccionada = val;
      document.querySelectorAll('.btn-quick-date').forEach(b => b.classList.remove('active'));
      renderizarTarjetasKDS();
    }

    function setFiltroFechaRapida(modo) {
      document.querySelectorAll('.btn-quick-date').forEach(b => b.classList.remove('active'));
      const hoy = new Date();
      if (modo === 'hoy') {
        fechaFiltroSeleccionada = hoy.toISOString().split('T')[0];
        document.getElementById('btnFiltroHoy').classList.add('active');
      } else if (modo === 'ayer') {
        const ayer = new Date(hoy);
        ayer.setDate(ayer.getDate() - 1);
        fechaFiltroSeleccionada = ayer.toISOString().split('T')[0];
        document.getElementById('btnFiltroAyer').classList.add('active');
      } else {
        fechaFiltroSeleccionada = "";
        document.getElementById('btnFiltroTodasFechas').classList.add('active');
      }
      document.getElementById('kdsFechaFiltro').value = fechaFiltroSeleccionada;
      renderizarTarjetasKDS();
    }

    function setFiltroEstado(estado) {
      filtroEstadoActual = estado;
      document.querySelectorAll('.btn-state-filter').forEach(b => b.classList.remove('active'));
      if (estado === 'activas') document.getElementById('btnEstadoActivas').classList.add('active');
      else if (estado === 'todas') document.getElementById('btnEstadoTodas').classList.add('active');
      else if (estado === 'servidas') document.getElementById('btnEstadoServidas').classList.add('active');
      renderizarTarjetasKDS();
    }

    async function cargarIdentidad() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}config/identidad.json?_t=${Date.now()}`);
        if (res.ok) {
          const conf = await res.json();
          if (conf && conf.nombre) document.getElementById('kdsNombreLocal').innerText = conf.nombre.toUpperCase();
        }
      } catch (e) {}
    }

    window.onload = () => {
      cargarIdentidad();
      cargarComandasCocina();
      setInterval(cargarComandasCocina, 2000);
    };
  </script>
</body>
</html>
